name: Deploy Nudge Web Dashboard

on:
  push:
    branches:
      - main
    paths:
      - "web_dashboard/**"
      - "scripts/generate_web_runtime_config.cjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Generate public Firebase runtime config
        env:
          NUDGE_FIREBASE_APP_CHECK_SITE_KEY: ${{ vars.NUDGE_FIREBASE_APP_CHECK_SITE_KEY }}
          NUDGE_WEB_ENVIRONMENT: production
        run: >-
          node scripts/generate_web_runtime_config.cjs
          --output web_dashboard/assets/runtime-config.js

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web_dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
