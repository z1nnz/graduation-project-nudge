<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nudge 小鎮雜貨店</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <link rel="stylesheet" href="assets/world_ui.css?v=3" />
    <link rel="stylesheet" href="assets/scene_room.css?v=3" />
    <link rel="stylesheet" href="assets/game_panel_content.css?v=1" />
    <link rel="stylesheet" href="assets/store_scene.css?v=2" />
    
  </head>
  <body class="w-page world-page" data-page="operations">
    <header class="w-hud store-hud"><a data-town-return href="town.html">← 回小鎮</a><h1>小鎮雜貨店</h1>
      <div class="hero-card store-purse" aria-label="目前自律幣"><span aria-hidden="true">●</span><strong>讀取中</strong><small>自律幣</small></div>
    </header>
    <div class="world-shell">
      <main class="main w-main store-main" id="storeMain">
        <section class="store-shelf" id="storeShelf" data-room-hidden="1" hidden aria-label="貨架">
          <div class="shop-tabs store-tabs" role="tablist" aria-label="貨架分類">
            <button class="shop-tab-btn active" type="button" role="tab" aria-selected="true" aria-controls="shop-items-container" data-tab="permanent">常駐角色</button>
            <button class="shop-tab-btn" type="button" role="tab" aria-selected="false" aria-controls="shop-items-container" data-tab="limited">限時角色</button>
            <button class="shop-tab-btn" type="button" role="tab" aria-selected="false" aria-controls="shop-items-container" data-tab="event_character">活動角色</button>
            <button class="shop-tab-btn" type="button" role="tab" aria-selected="false" aria-controls="shop-items-container" data-tab="decor">小屋家具</button>
          </div>
          <p id="shopStatus" class="shop-status" role="status" aria-live="polite">正在連線到雲端帳本…</p>
          <div class="shop-grid store-slots" id="shop-items-container" role="tabpanel" aria-live="polite">
            <div class="shop-empty">載入中…</div>
          </div>
        </section>
        <section class="store-ledger" id="storeLedger" data-room-hidden="1" hidden aria-label="錢箱">
          <div class="store-coin-pile" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
          <p class="store-ledger-line">錢箱裡是你用真實行動換來的自律幣：<strong data-store-coins>—</strong> 枚。</p>
          <ul class="store-ledger-rules">
            <li><b>雲端帳本扣款</b>：每次兌換都由雲端確認餘額後扣款，網頁不會自己改變金幣或解鎖商品。</li>
            <li><b>不會重複扣款</b>：連線中斷時可以再按一次，同一個商品只會兌換一次。</li>
            <li><b>只來自真實行動</b>：自律幣只來自雲端確認的任務與專注，沒有額外折扣或加成。</li>
          </ul>
          <a class="w-btn" href="quests.html">去委託所接任務賺金幣</a>
        </section>
      </main>
    </div>
    <script src="assets/town_routes.js?v=7"></script>
    <script src="assets/town_return.js?v=2"></script>
    <script src="assets/reward_shop_core.js?v=1"></script>
    <script src="assets/reward_shop.js?v=2"></script>
    <script src="assets/app.js?v=30"></script>
    <script src="assets/sprite_player.js?v=1"></script>
    <script src="assets/npc_dialog.js?v=1"></script>
    <script src="assets/scene_room.js?v=4"></script>
    <script src="assets/store_scene.js?v=2"></script>
  </body>
</html>
