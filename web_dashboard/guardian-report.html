<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nudge 孩子週報</title>
    <link rel="stylesheet" href="assets/styles.css?v=13" />
  </head>
  <body data-page="guardian">
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="dashboard.html"><span class="brand-mark">N</span><span><strong>Nudge</strong><small>孩子週報</small></span></a>
        <nav class="nav"><a href="dashboard.html">總覽入口</a><a class="active" href="guardian.html">家長陪伴中心</a><a href="groups.html">團體 / 教育管理</a></nav>
      </aside>
      <main class="main">
        <header class="hero split">
          <div>
            <span class="eyebrow">Weekly Companion Report</span>
            <h1>給家長看的週報，不顯示過度細節。</h1>
            <p>只呈現趨勢、可陪伴方向與風險提醒，不顯示每分鐘行為或原始健康資料。</p>
            <div class="subnav"><a href="guardian.html">中心總覽</a><a class="active" href="guardian-report.html">孩子週報</a><a href="guardian-encouragement.html">鼓勵卡</a><a href="guardian-goals.html">共同目標</a><a href="guardian-permissions.html">資料同意</a></div>
          </div>
          <div class="hero-card"><span>目前完成率</span><strong data-family-report-completion>未開放</strong><p>只使用孩子 App 同意分享的摘要。</p></div>
        </header>
        <section class="metric-grid page-section">
          <article class="metric-card has-chart">
            <div class="metric-info">
              <small>完成任務</small>
              <strong id="childTasksCount">未開放</strong>
            </div>
            <div class="stat-ring" id="childTasksRing" style="--p: 0%; --accent-color: #0ff;"><strong>—</strong></div>
          </article>
          <article class="metric-card has-chart">
            <div class="metric-info">
              <small>專注時間</small>
              <strong id="childFocusVal">未開放</strong>
            </div>
            <div class="stat-ring" id="childFocusRing" style="--p: 0%; --accent-color: #ffad2f;"><strong>—</strong></div>
          </article>
          <article class="metric-card has-chart">
            <div class="metric-info">
              <small>平均睡眠</small>
              <strong id="childSleepVal">未開放</strong>
            </div>
            <div class="stat-ring" id="childSleepRing" style="--p: 0%; --accent-color: #8d7aff;"><strong>—</strong></div>
          </article>
          <article class="metric-card has-chart">
            <div class="metric-info">
              <small>平均步數</small>
              <strong id="childStepsVal">未開放</strong>
            </div>
            <div class="stat-ring" id="childStepsRing" style="--p: 0%; --accent-color: #22c7bb;"><strong>—</strong></div>
          </article>
        </section>
        <section class="workspace-layout page-section">
          <article class="panel chart-card"><span class="eyebrow">週趨勢</span><h2>孩子同意分享的自律趨勢</h2><canvas id="sleepChart"></canvas></article>
          <aside class="result-board"><strong>本週關心方向</strong><p data-family-report-insight>等待孩子 App 同步已同意的摘要資料。</p><button class="button primary" data-toast="週報匯出將只包含孩子已同意的摘要">下載已同意摘要</button></aside>
        </section>
      </main>
    </div>
    <script src="assets/app.js?v=22"></script>
  </body>
</html>
