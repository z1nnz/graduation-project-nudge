<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nudge 孩子週報</title>
    <link rel="stylesheet" href="assets/styles.css?v=17" />
    <link rel="stylesheet" href="assets/social_scene.css?v=1" />
    <link rel="stylesheet" href="assets/world_ui.css?v=3" />
    <link rel="stylesheet" href="assets/scene_room.css?v=3" />
    <link rel="stylesheet" href="assets/game_panel_content.css?v=1" />
    <link rel="stylesheet" href="assets/scenes/social_world/living_room.css?v=1" />
  </head>
  <body class="w-page world-page" data-page="guardian" data-social-facility="family" data-living-room="guardian-report">
    <header class="w-hud"><a data-town-return href="town.html">← 回小鎮</a><h1>孩子週報</h1></header>
    <main class="main w-main" id="sceneMain" tabindex="-1">
        <header class="hero scene-hero">
          <div>
            <span class="eyebrow">Weekly Companion Report</span>
            <h1>給家長看的週報，不顯示過度細節。</h1>
            <p>只呈現趨勢、可陪伴方向與風險提醒，不顯示每分鐘行為或原始健康資料。</p>
          </div>
          <div class="hero-card"><span>目前完成率</span><strong data-family-report-completion>未開放</strong><p>只使用孩子 App 同意分享的摘要。</p></div>
        </header>
        <section class="metric-grid">
          <article class="metric-card has-chart">
            <div class="metric-info">
              <small>完成任務</small>
              <strong id="childTasksCount">未開放</strong>
            </div>
            <div class="stat-ring" id="childTasksRing" style="--p: 0%; --accent-color: #0ff;"><strong>—</strong></div>
          </article>
          <article class="metric-card has-chart">
            <div class="metric-info">
              <small>專注時間</small>
              <strong id="childFocusVal">未開放</strong>
            </div>
            <div class="stat-ring" id="childFocusRing" style="--p: 0%; --accent-color: #ffad2f;"><strong>—</strong></div>
          </article>
          <article class="metric-card has-chart">
            <div class="metric-info">
              <small>平均睡眠</small>
              <strong id="childSleepVal">未開放</strong>
            </div>
            <div class="stat-ring" id="childSleepRing" style="--p: 0%; --accent-color: #8d7aff;"><strong>—</strong></div>
          </article>
          <article class="metric-card has-chart">
            <div class="metric-info">
              <small>平均步數</small>
              <strong id="childStepsVal">未開放</strong>
            </div>
            <div class="stat-ring" id="childStepsRing" style="--p: 0%; --accent-color: #22c7bb;"><strong>—</strong></div>
          </article>
        </section>
        <section class="workspace-layout">
          <article class="scene-panel chart-card"><span class="eyebrow">週趨勢</span><h2>孩子同意分享的自律趨勢</h2><canvas id="sleepChart"></canvas></article>
          <aside class="result-board"><strong>本週關心方向</strong><p data-family-report-insight>等待孩子 App 同步已同意的摘要資料。</p><button class="button primary" data-toast="週報匯出將只包含孩子已同意的摘要">下載已同意摘要</button></aside>
        </section>
      </main>
    <script src="assets/town_routes.js?v=7"></script>
    <script src="assets/town_return.js?v=2"></script>
    <script src="assets/social_scene.js?v=1"></script>
    <script src="assets/app.js?v=32"></script>
    <script src="assets/sprite_player.js?v=1"></script>
    <script src="assets/npc_dialog.js?v=1"></script>
    <script src="assets/game_sfx.js?v=1"></script>
    <script src="assets/scene_room.js?v=5"></script>
    <script src="assets/scenes/social_world/living_room.js?v=1"></script>
    <script src="assets/scenes/social_world/social_rooms.js?v=1"></script>
    <script src="assets/scenes/social_world/living_page.js?v=1"></script>
  </body>
</html>
