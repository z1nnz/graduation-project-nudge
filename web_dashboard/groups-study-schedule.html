<!doctype html>
<html lang="zh-Hant">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Nudge 讀書時段管理</title><link rel="stylesheet" href="assets/styles.css?v=14" /></head>
  <body data-page="groups">
    <div class="shell"><aside class="sidebar"><a class="brand" href="dashboard.html"><span class="brand-mark">N</span><span><strong>Nudge</strong><small>讀書時段</small></span></a><nav class="nav"><a href="dashboard.html">總覽入口</a><a class="active" href="groups.html">團體 / 教育管理</a></nav></aside>
      <main class="main">
        <header class="hero split"><div><span class="eyebrow">Study Schedule</span><h1>發布共同時段，成員自行開始活動。</h1><p>管理者提供共同目標與建議時間；每位成員仍可依自己的節奏開始、暫停與完成。</p><div class="subnav"><a href="groups.html">中心總覽</a><a href="groups-challenge.html">挑戰建立</a><a class="active" href="groups-study-schedule.html">讀書時段</a><a href="groups-ranking.html">排行與週報</a><a href="groups-templates.html">考試模板</a></div></div><div class="hero-card"><span>已發布時段</span><strong data-count="0">0</strong><p>由團體成員自行參與。</p></div></header>
        <section class="workspace-layout page-section" data-tool="study-schedule">
          <article class="tool-panel"><div class="tool-copy"><span class="eyebrow">Schedule</span><h2>新增共同自律時段</h2><p>發布後會同步到成員 App；這不是由管理者統一開關的強制場次。</p></div><div class="tool-grid"><label class="field"><span>時段名稱</span><input data-study-title value="資料庫期末共讀" /></label><label class="field"><span>建議時間</span><input data-study-time type="datetime-local" /></label><label class="field"><span>建議長度</span><select data-study-duration><option value="50 分鐘">50 分鐘</option><option value="90 分鐘">90 分鐘</option><option value="120 分鐘">120 分鐘</option></select></label><label class="field"><span>活動類型</span><select data-study-room><option value="讀書房">讀書房</option><option value="考前衝刺房">考前衝刺房</option><option value="靜音房">靜音房</option></select></label></div><div class="generated-card blue" data-output="study-preview"><strong>資料庫期末共讀</strong><p>成員可依建議時段參與，也可以在自己的時間完成目標。</p></div><div class="button-row"><button class="button primary" data-action="save-study-schedule" type="button">發布並同步到成員 App</button></div></article>
          <aside class="panel"><span class="eyebrow">Upcoming</span><h2>即將開始</h2><div class="saved-list" data-study-list><article><strong>尚未排程</strong><span>等待正式團體資料同步。</span></article></div></aside>
        </section>
      </main>
    </div><script src="assets/app.js?v=22"></script>
  </body>
</html>
