    <header class="w-hud"><a data-town-return href="town.html">← 回小鎮</a><h1>家庭資料同意</h1></header>
    <main class="main w-main" id="sceneMain" tabindex="-1">
        <header class="hero scene-hero"><div><span class="eyebrow">Consent Summary</span><h1>家長查看同意狀態，孩子控制分享範圍。</h1><p>這裡是唯讀摘要。家長不能替孩子開啟週報、任務分類或健康趨勢。</p></div><div class="hero-card"><span>孩子目前同意</span><strong data-family-consent-summary>尚未開放</strong><p>App 端變更會即時同步。</p></div></header>
        <section class="permission-grid" aria-label="孩子目前同意的家庭資料範圍">
          <article class="mini-card"><strong>今日總覽</strong><p>整體完成率與專注摘要，不含逐筆任務。</p><button class="button ghost" data-family-consent="summary" disabled>孩子未開放</button></article>
          <article class="mini-card"><strong>每週回顧</strong><p>系統整理的週趨勢，不顯示原始資料。</p><button class="button ghost" data-family-consent="weeklyReport" disabled>孩子未開放</button></article>
          <article class="mini-card"><strong>任務類別</strong><p>只顯示學習、健康、生活等分類彙整。</p><button class="button ghost" data-family-consent="taskCategories" disabled>孩子未開放</button></article>
          <article class="mini-card"><strong>健康趨勢</strong><p>只顯示步數與睡眠趨勢，不含逐分鐘紀錄。</p><button class="button ghost" data-family-consent="healthTrends" disabled>孩子未開放</button></article>
        </section>
        <section class="scene-panel"><span class="eyebrow">資料原則</span><h2>同意可以隨時收回。</h2><p>孩子在 App 關閉任一範圍後，家長端會立即更新。家庭目標與鼓勵不會自動取得額外資料權限。</p></section>
