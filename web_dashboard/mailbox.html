<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="assets/post_office_scene.css?v=2" />
    <title>Nudge 小鎮郵箱</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <link rel="stylesheet" href="assets/mailbox.css?v=1" />
    <link rel="stylesheet" href="assets/social_scene.css?v=1" />
    <link rel="stylesheet" href="assets/plaza_scene.css?v=1" />
  </head>
  <body class="w-page" data-page="mailbox" data-social-facility="plaza">
    <a class="scene-skip-link" href="#sceneMain">跳至內容</a>
    <header class="scene-topbar">
      <a data-town-return href="town.html">← 回小鎮</a>
      <span class="scene-place" data-scene-place>小鎮廣場</span>
    </header>
    <nav class="scene-nav" data-scene-nav></nav>
    <main class="main scene-main" id="sceneMain" tabindex="-1">
        <section class="post-office-scene" aria-label="小鎮郵局">
          <span class="post-office-dust" aria-hidden="true">✦</span>
          <a class="w-btn post-office-object" href="#mailboxTitle">拆開來信</a>
          <a class="w-btn post-office-object post-office-clock" href="#mailboxDrawer">已讀抽屜</a>
          <span class="post-office-lamp" aria-hidden="true"></span>
          <button class="w-btn post-office-object post-office-npc" type="button" aria-label="小信，郵局嚮導" aria-haspopup="dialog" data-post-office-guide><span class="post-office-actor" aria-hidden="true"></span>小信</button>
        </section>
        <header class="w-parchment">
          <div>
            <span class="eyebrow">Town Mailbox</span>
            <h1>小鎮郵箱</h1>
            <p>家庭與團體的邀請、接受或婉拒的結果都會寄到這裡；App 與 Web 讀的是同一份正式通知。點信件可以回到對應的場景處理。</p>
          </div>
          <div class="hero-card">
            <span>未讀信件</span>
            <strong data-mailbox-unread>0</strong>
            <p>推播尚未在實機驗收，目前以站內信為準。</p>
          </div>
        </header>
        <section class="w-parchment" aria-labelledby="mailboxTitle">
          <span class="eyebrow">Letters</span>
          <h2 id="mailboxTitle" tabindex="-1">未讀信件</h2>
          <p class="visit-note" data-mailbox-status aria-live="polite">正在打開信箱…</p>
          <ul class="mailbox-list" data-mailbox-letters><li class="visit-empty">載入中…</li></ul>
          <details id="mailboxDrawer" class="mailbox-envelope" tabindex="-1">
            <summary>已讀信件抽屜</summary>
            <ul class="mailbox-list" data-mailbox-drawer></ul>
          </details>
        </section>
      </main>
    <script src="assets/mailbox.js?v=3"></script>
    <script src="assets/town_routes.js?v=7"></script>
    <script src="assets/town_return.js?v=2"></script>
    <script src="assets/social_scene.js?v=1"></script>
    <script src="assets/app.js?v=30"></script>
    <script src="assets/sprite_player.js?v=1"></script>
    <script src="assets/npc_dialog.js?v=1"></script>
    <script src="assets/post_office_scene.js?v=2"></script>
  </body>
</html>
