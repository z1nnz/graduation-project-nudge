<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nudge 家庭庭院</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <link rel="stylesheet" href="assets/social-scenes.css?v=1" />
    <link rel="stylesheet" href="assets/social_scene.css?v=1" />
    <link rel="stylesheet" href="assets/world_ui.css?v=1" />
    <link rel="stylesheet" href="assets/family_garden.css?v=1" />
    <link rel="stylesheet" href="assets/safety.css?v=1" />
    <link rel="stylesheet" href="assets/community_ground.css?v=1" />
  </head>
  <body class="w-page" data-page="family-courtyard" data-social-facility="family">
    <a class="scene-skip-link" href="#sceneMain">跳至內容</a>
    <header class="w-hud">
      <a data-town-return href="town.html">← 回小鎮</a>
      <h1>家庭庭院</h1>
    </header>
    <nav class="scene-nav" data-scene-nav></nav>
    <main class="main w-main" id="sceneMain" tabindex="-1">
        <section class="community-ground community-ground--courtyard" data-community-ground aria-label="家庭庭院">
          <span class="community-spark" aria-hidden="true">✦</span><span class="community-light" aria-hidden="true"></span>
          <button class="w-btn community-stop" type="button" data-community-open="garden" style="--w-x:51%;--w-y:57%" aria-label="花圃">花圃</button>
          <button class="w-btn community-stop" type="button" data-community-open="reviews" style="--w-x:22%;--w-y:32%" aria-label="留言桌">留言桌</button>
          <button class="w-btn community-stop" type="button" data-community-open="letters" style="--w-x:79%;--w-y:64%" aria-label="鼓勵信箱">鼓勵信箱</button>
          <button class="w-btn community-stop community-host" type="button" data-community-open="guide" aria-label="庭院嚮導">庭院嚮導</button>
        </section>
        <dialog class="w-parchment community-guide-dialog" aria-labelledby="communityGuideTitle">
          <h2 id="communityGuideTitle">庭院嚮導</h2>
          <p>你可以看看共同花圃、在桌上寫每週回顧，或到信箱安排鼓勵信。</p>
          <form method="dialog"><button class="w-btn">關閉</button></form>
        </dialog>
        <header class="community-scope">
          <div>
            <span class="eyebrow">Family Courtyard</span>
            <h1>在庭院裡互相照顧</h1>
            <p>家長送出鼓勵卡與共同目標的提議；孩子自己決定收下、接受與開始，也掌握分享同意。家庭樹只隨家庭互動成長。</p>
          </div>
          <div class="hero-card">
            <span>切換家庭</span>
            <label class="sr-only" for="socialScopePicker">選擇家庭</label>
            <select id="socialScopePicker" data-social-scope-picker hidden></select>
            <p>家長只能提議與鼓勵，無法代替孩子同意或開始活動。</p>
          </div>
        </header>
        <div data-family-garden hidden>
          <section class="w-parchment family-garden" data-community-panel="garden" tabindex="-1" hidden>
            <button class="w-btn" type="button" data-community-return>回庭院</button>
            <h2>共同花圃</h2>
            <div class="family-garden-plot" data-garden-plot aria-label="共同花圃"></div>
            <p data-garden-status role="status"></p>
          </section>
          <section class="w-parchment family-garden" data-community-panel="reviews" tabindex="-1" hidden>
            <button class="w-btn" type="button" data-community-return>回庭院</button>
            <h2>每週家庭回顧</h2>
            <img class="family-review-cover" src="assets/family_garden/reflection.png" alt="" width="960" height="600" loading="lazy" />
            <p data-garden-week></p>
            <div data-garden-reviews></div>
            <form data-garden-review>
              <label>套用固定句型 <select name="template"><option value="">選擇句型</option></select></label>
              <label>這週我做到了 <textarea name="achievement" maxlength="100" required></textarea></label>
              <label>給家人的一句感謝 <textarea name="gratitude" maxlength="100" required></textarea></label>
              <button class="w-btn is-gold" type="submit">儲存回顧</button>
              <button class="w-btn" data-garden-remove type="button" hidden>刪除我的內容</button>
            </form>
          </section>
          <section class="w-parchment family-garden" data-community-panel="letters" tabindex="-1" hidden>
            <button class="w-btn" type="button" data-community-return>回庭院</button>
            <h2>排程鼓勵信</h2>
            <label data-garden-optout hidden><input type="checkbox" /> 不接收排程鼓勵信</label>
            <form data-garden-letter hidden>
              <label>鼓勵信 <textarea name="body" maxlength="280" required></textarea></label>
              <label>送達時機 <select name="kind"><option value="date">指定日期（臺灣時間 09:00）</option><option value="goal">共同目標完成後</option></select></label>
              <label data-garden-date>日期 <input name="date" type="date" /></label>
              <label data-garden-goal hidden>共同目標 <select name="goalId"></select></label>
              <button class="w-btn is-gold" type="submit">安排鼓勵信</button>
            </form>
          </section>
        </div>
        <section class="w-panel safety-panel" data-safety-family hidden>
          <h2>未成年保護</h2>
          <p data-safety-family-result role="status"></p>
          <form hidden>
            <label><span>允許加入語音</span><input type="checkbox" name="voice" /></label>
            <label><span>允許陌生人在聊天室提及我</span><input type="checkbox" name="mentions" /></label>
            <label><span>我已確認要使用以上設定</span><input type="checkbox" name="confirm" required /></label>
            <button class="w-btn" type="submit">確認保護設定</button>
          </form>
        </section>

        <div data-social-scene aria-live="polite"><p class="visit-empty">載入中…</p></div>
      </main>
    <script src="assets/relationship_membership_contract.js?v=1"></script>
    <script src="assets/family_link_contract.js?v=1"></script>
    <script src="assets/family_garden.js?v=1"></script>
    <script src="assets/family_group_scenes.js?v=3"></script>
    <script src="assets/town_routes.js?v=5"></script>
    <script src="assets/town_return.js?v=2"></script>
    <script src="assets/social_scene.js?v=1"></script>
    <script src="assets/safety_ui.js?v=1"></script>
    <script src="assets/app.js?v=30"></script>
    <script src="assets/community_ground.js?v=1"></script>
  </body>
</html>
