<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nudge 家庭庭院</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <link rel="stylesheet" href="assets/social-scenes.css?v=1" />
    <link rel="stylesheet" href="assets/social_scene.css?v=1" />
    <link rel="stylesheet" href="assets/world_ui.css?v=1" />
    <link rel="stylesheet" href="assets/safety.css?v=1" />
  </head>
  <body class="w-page" data-page="family-courtyard" data-social-facility="family">
    <a class="scene-skip-link" href="#sceneMain">跳至內容</a>
    <header class="w-hud">
      <a data-town-return href="town.html">← 回小鎮</a>
      <h1>家庭庭院</h1>
    </header>
    <nav class="scene-nav" data-scene-nav></nav>
    <main class="w-main" id="sceneMain" tabindex="-1">
        <header class="hero scene-hero">
          <div>
            <span class="eyebrow">Family Courtyard</span>
            <h1>在庭院裡互相照顧</h1>
            <p>家長送出鼓勵卡與共同目標的提議；孩子自己決定收下、接受與開始，也掌握分享同意。家庭樹只隨家庭互動成長。</p>
          </div>
          <div class="hero-card">
            <span>切換家庭</span>
            <label class="sr-only" for="socialScopePicker">選擇家庭</label>
            <select id="socialScopePicker" data-social-scope-picker hidden></select>
            <p>家長只能提議與鼓勵，無法代替孩子同意或開始活動。</p>
          </div>
        </header>
        <section class="w-panel safety-panel" data-safety-family hidden>
          <h2>未成年保護</h2>
          <p data-safety-family-result role="status"></p>
          <form hidden>
            <label><span>允許加入語音</span><input type="checkbox" name="voice" /></label>
            <label><span>允許陌生人在聊天室提及我</span><input type="checkbox" name="mentions" /></label>
            <label><span>我已確認要使用以上設定</span><input type="checkbox" name="confirm" required /></label>
            <button class="w-btn" type="submit">確認保護設定</button>
          </form>
        </section>

        <div data-social-scene aria-live="polite"><p class="visit-empty">載入中…</p></div>
      </main>
    <script src="assets/relationship_membership_contract.js?v=1"></script>
    <script src="assets/family_link_contract.js?v=1"></script>
    <script src="assets/family_group_scenes.js?v=1"></script>
    <script src="assets/town_routes.js?v=2"></script>
    <script src="assets/town_return.js?v=2"></script>
    <script src="assets/social_scene.js?v=1"></script>
    <script src="assets/safety_ui.js?v=1"></script>
    <script src="assets/app.js?v=27"></script>
  </body>
</html>
