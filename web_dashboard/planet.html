    <script>
      // Sync targeted planet & satellite colors from admin dashboard
      document.addEventListener('DOMContentLoaded', () => {
        const colors = JSON.parse(localStorage.getItem('nudgeColors') || '{}');

        if (colors['planet']) {
          const p = document.querySelector('.planet');
          if (p) {
            p.style.background = `radial-gradient(circle at 38% 28%, ${colors['planet']}44, transparent 30%), linear-gradient(145deg, #0a0f25, ${colors['planet']})`;
            p.style.boxShadow = `inset 0 0 40px ${colors['planet']}66, 0 0 20px ${colors['planet']}33`;
          }
        }

        ['sat1', 'sat2', 'sat3'].forEach(satId => {
          if (colors[satId]) {
            const sat = document.querySelector(`.mission-satellite.${satId.replace('sat', 's')}`);
            if (sat) {
              sat.style.background = colors[satId];
              sat.style.boxShadow = `0 0 15px ${colors[satId]}`;
            }
          }
        });
      });
    </script>

    <script>
      // Render the signed-in account's own planets (#82 slice 3). The old
      // version read a demo account (nudgeActiveDemoUserId / an_nudge) and
      // invented planet kinds from planetCount; both are gone.
      (function () {
        const core = window.NudgePlanetCore;
        if (!core) return;
        let started = false;
        let unsubscribe = null;
        let authOff = null;
        let generation = 0;

        function show(text, note) {
          document.getElementById('planetCount').textContent = text;
          document.getElementById('planetNote').textContent = note;
        }

        function render(data) {
          const result = core.planets(data);
          show(String(result.count), result.note || '只顯示你自己帳號的星球成果。');
          const orbit = document.getElementById('unlockedPlanetsOrbit');
          if (!orbit) return;
          orbit.textContent = '';
          orbit.setAttribute('role', 'img');
          orbit.setAttribute('aria-label', result.count ? `已解鎖 ${result.count} 顆星球` : '還沒有解鎖的星球');
          const radius = window.innerWidth <= 620 ? 110 : 250;
          document.documentElement.style.setProperty('--planet-orbit-radius', `${radius}px`);
          result.nodes.forEach((planet, index) => {
            const node = document.createElement('div');
            node.className = 'unlocked-planet-node';
            node.title = planet.name;
            node.style.setProperty('--planet-angle', `${(360 / result.nodes.length) * index}deg`);
            node.style.setProperty('--planet-color', planet.color);
            orbit.appendChild(node);
          });
        }

        function start() {
          if (started || !window.firebase?.apps?.length || !window.firebase.auth) return;
          started = true;
          authOff = window.firebase.auth().onAuthStateChanged(user => {
            const own = ++generation;
            if (unsubscribe) { unsubscribe(); unsubscribe = null; }
            if (!user || user.isAnonymous) {
              render(null);
              show('—', '登入後才會顯示你的星球；這裡不顯示示範帳號的資料。');
              return;
            }
            show('讀取中', '只顯示你自己帳號的星球成果。');
            unsubscribe = window.firebase.firestore().collection('users').doc(user.uid).onSnapshot({includeMetadataChanges:true}, snap => {
              if (own !== generation || window.firebase.auth().currentUser?.uid !== user.uid) return;
              if (snap.metadata.fromCache || snap.metadata.hasPendingWrites) {
                render(null); show('—', '星球仍在等待本人雲端確認。'); return;
              }
              render(snap.exists ? snap.data() : null);
            }, () => {
              if (own === generation) { render(null); show('—', '暫時無法讀取星球成果，請確認網路後重新整理。'); }
            });
          });
        }
        document.addEventListener('firebase-ready', start);
        window.addEventListener('pagehide', () => { ++generation; unsubscribe?.(); unsubscribe = null; authOff?.(); authOff = null; started = false; render(null); });
        window.addEventListener('pageshow', start);
        start();
      })();
    </script>
    <style>
      .unlocked-planet-node {
        position: absolute; width: 24px; height: 24px; border-radius: 50%; top: 50%; left: 50%;
        background: radial-gradient(circle at 30% 30%, #fff, var(--planet-color));
        box-shadow: 0 0 20px var(--planet-color), 0 0 40px color-mix(in srgb, var(--planet-color) 55%, transparent);
        transform: translate(-50%, -50%) rotate(var(--planet-angle)) translateX(var(--planet-orbit-radius, 250px)) rotate(calc(-1 * var(--planet-angle)));
        animation: planet-orbit 40s linear infinite;
      }
      @keyframes planet-orbit {
        from { transform: translate(-50%, -50%) rotate(var(--planet-angle)) translateX(var(--planet-orbit-radius, 250px)) rotate(calc(-1 * var(--planet-angle))); }
        to { transform: translate(-50%, -50%) rotate(calc(var(--planet-angle) + 360deg)) translateX(var(--planet-orbit-radius, 250px)) rotate(calc(-1 * var(--planet-angle) - 360deg)); }
      }
      .orbit-unlocked { border: 1px dashed rgba(255,255,255,0.1); }
      @media (prefers-reduced-motion: reduce) { .unlocked-planet-node { animation: none; } }
    </style>
