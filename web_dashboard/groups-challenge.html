<!doctype html>
<html lang="zh-Hant">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Nudge 團體挑戰建立器</title><link rel="stylesheet" href="assets/styles.css?v=17" />
    <link rel="stylesheet" href="assets/social_scene.css?v=1" /></head>
  <body data-page="groups" data-social-facility="guild">
    <a class="scene-skip-link" href="#sceneMain">跳至內容</a>
    <header class="scene-topbar">
      <a data-town-return href="town.html">← 回小鎮</a>
      <span class="scene-place" data-scene-place>團體會館</span>
    </header>
    <nav class="scene-nav" data-scene-nav></nav>
    <main class="main scene-main" id="sceneMain" tabindex="-1">
        <header class="hero scene-hero"><div><span class="eyebrow">Challenge Builder</span><h1>企業、班級、讀書會挑戰在這裡建立。</h1><p>管理者設定共同目標與規則；每位成員仍由自己決定是否加入及完成。</p></div><div class="hero-card"><span>團體成員</span><strong data-count="0">0</strong><p>由正式團體資料同步。</p></div></header>
        <section class="tool-panel" data-tool="challenge-builder">
          <div class="tool-copy"><span class="eyebrow">Challenge Builder</span><h2>團體挑戰建立器</h2><p>包含排行榜規則、提醒節奏與獎勵條件。</p></div>
          <div class="tool-grid"><label class="field"><span>發布到團體</span><input data-challenge-group value="載入目前團體…" readonly /></label><label class="field"><span>挑戰類型</span><select data-challenge-type><option value="專注挑戰">專注挑戰</option><option value="步數挑戰">步數挑戰</option><option value="早睡挑戰">早睡挑戰</option><option value="期末衝刺">期末衝刺</option></select></label><label class="field"><span>活動天數</span><input data-challenge-days type="number" min="3" max="30" value="7" /></label><label class="field"><span>獎勵</span><select data-challenge-reward><option value="限定徽章">限定徽章</option><option value="商城折扣券">商城折扣券</option><option value="班級排行榜稱號">班級排行榜稱號</option></select></label></div>
          <div class="generated-card blue" data-output="challenge-preview"><strong>尚未發布挑戰</strong><p>設定完成後發布，成員 App 會讀取同一份團體挑戰。</p></div>
          <div class="button-row"><button class="button primary" data-action="generate-challenge" type="button">發布並同步到成員 App</button><button class="button ghost" data-action="download-challenge" type="button">下載活動規則</button></div>
        </section>
      </main>    <script src="assets/town_routes.js?v=7"></script>
    <script src="assets/town_return.js?v=2"></script>
    <script src="assets/social_scene.js?v=1"></script>
<script src="assets/app.js?v=30"></script>
  </body>
</html>
