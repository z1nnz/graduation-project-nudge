<!doctype html>
<html lang="zh-Hant">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Nudge 鼓勵卡</title><link rel="stylesheet" href="assets/styles.css?v=17" />
    <link rel="stylesheet" href="assets/social_scene.css?v=1" /></head>
  <body data-page="guardian" data-social-facility="family">
    <a class="scene-skip-link" href="#sceneMain">跳至內容</a>
    <header class="scene-topbar">
      <a data-town-return href="town.html">← 回小鎮</a>
      <span class="scene-place" data-scene-place>家庭庭院</span>
    </header>
    <nav class="scene-nav" data-scene-nav></nav>
    <main class="main scene-main" id="sceneMain" tabindex="-1">
        <header class="hero scene-hero">
          <div><span class="eyebrow">Encouragement Cards</span><h1>送鼓勵，不代替孩子完成任務。</h1><p>選擇語氣、卡片、訊息，送出後孩子 App 端可以收到鼓勵紀錄。</p></div>
          <div class="hero-card"><span>已送出</span><strong data-family-encouragement-count>0</strong><p>孩子回應後，雙方家庭羈絆 +3 XP。</p></div>
        </header>
        <section class="workspace-layout" data-tool="encouragement-card">
          <article class="tool-panel">
            <div class="tool-copy"><span class="eyebrow">Create Card</span><h2>製作鼓勵卡</h2><p>系統會保留正向語氣，避免變成壓力訊息。</p></div>
            <div class="tool-grid">
              <label class="field"><span>卡片類型</span><select data-encourage-type><option value="今天也辛苦了">今天也辛苦了</option><option value="休息也是自律">休息也是自律</option><option value="我們一起調整">我們一起調整</option></select></label>
              <label class="field"><span>語氣</span><select data-encourage-tone><option value="溫柔">溫柔</option><option value="活潑">活潑</option><option value="簡短">簡短</option></select></label>
              <label class="field wide"><span>訊息</span><textarea data-encourage-message rows="5">這週你已經很努力了，今晚我們先把睡眠穩住就好。</textarea></label>
            </div>
            <div class="generated-card warm with-icon" data-output="encourage-preview">
              <div class="card-icon">💌</div>
              <div class="card-content">
                <strong>今天也辛苦了</strong>
                <p>這週你已經很努力了，今晚我們先把睡眠穩住就好。</p>
              </div>
            </div>
            <div class="button-row"><button class="button primary" data-action="preview-encouragement" type="button">預覽卡片</button><button class="button ghost" data-action="send-encouragement" type="button">送到孩子 App</button></div>
          </article>
          <aside class="scene-panel"><span class="eyebrow">Record</span><h2>鼓勵紀錄</h2><div class="saved-list" data-encourage-list><article><strong>尚未送出</strong><span>送出鼓勵卡後會出現在這裡。</span></article></div></aside>
        </section>
      </main>    <script src="assets/town_routes.js?v=5"></script>
    <script src="assets/town_return.js?v=2"></script>
    <script src="assets/social_scene.js?v=1"></script>
<script src="assets/app.js?v=30"></script>
  </body>
</html>
