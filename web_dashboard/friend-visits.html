<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nudge 好友拜訪</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <link rel="stylesheet" href="assets/social-scenes.css?v=1" />
    <link rel="stylesheet" href="assets/social_scene.css?v=1" />
    <link rel="stylesheet" href="assets/plaza_scene.css?v=1" />
  </head>
  <body data-page="friend-visits" data-social-facility="plaza">
    <a class="scene-skip-link" href="#sceneMain">跳至內容</a>
    <header class="scene-topbar">
      <a data-town-return href="town.html">← 回小鎮</a>
      <span class="scene-place" data-scene-place>小鎮廣場</span>
    </header>
    <nav class="scene-nav" data-scene-nav></nav>
    <main class="main scene-main" id="sceneMain" tabindex="-1">
        <header class="hero scene-hero">
          <div>
            <span class="eyebrow">Friend Visits</span>
            <h1>到好友公開的場景走走</h1>
            <p>只有互相接受的正式好友能拜訪，而且只能看到對方選擇公開的場景。拜訪只會留下一個固定鼓勵，不會看到對方的活動、健康或專注數值，也不會產生任何獎勵。</p>
          </div>
          <div class="hero-card">
            <span>今天來訪的好友</span>
            <strong data-visit-today-count>0</strong>
            <p>依真實拜訪紀錄計算。</p>
          </div>
        </header>

        <section class="scene-panel visit-settings" aria-labelledby="visitSettingsTitle">
          <span class="eyebrow">My visibility</span>
          <h2 id="visitSettingsTitle">我的拜訪設定</h2>
          <div class="visit-setting-row">
            <label class="visit-toggle"><input type="checkbox" data-visit-allow /><span>開放好友拜訪</span></label>
            <label class="visit-scene-select"><span>公開場景</span>
              <select data-visit-scene>
                <option value="cabin">我的小屋</option>
                <option value="garden">專注花園</option>
                <option value="study_corner">讀書角落</option>
              </select>
            </label>
          </div>
          <p class="visit-note" data-visit-setting-status aria-live="polite">登入後可設定。</p>
        </section>

        <section class="scene-panel" aria-labelledby="visitFriendsTitle">
          <span class="eyebrow">Visit a friend</span>
          <h2 id="visitFriendsTitle">拜訪好友</h2>
          <div class="visit-friend-grid" data-visit-friends><p class="visit-empty">正在載入正式好友…</p></div>
        </section>

        <section class="planet-depth">
          <article class="event-feed">
            <span class="eyebrow">Visits to you</span>
            <h2>誰來拜訪過我</h2>
            <ul class="timeline compact" data-visit-incoming><li class="visit-empty">載入中…</li></ul>
          </article>
          <article class="event-feed">
            <span class="eyebrow">My visits</span>
            <h2>我拜訪過的好友</h2>
            <ul class="timeline compact" data-visit-outgoing><li class="visit-empty">載入中…</li></ul>
          </article>
        </section>
      </main>
    <script src="assets/friend_visits.js?v=1"></script>
    <script src="assets/town_routes.js?v=2"></script>
    <script src="assets/town_return.js?v=2"></script>
    <script src="assets/social_scene.js?v=1"></script>
    <script src="assets/app.js?v=27"></script>
  </body>
</html>
