<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nudge 好友拜訪</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <link rel="stylesheet" href="assets/social-scenes.css?v=1" />
    <link rel="stylesheet" href="assets/social_scene.css?v=1" />
    <link rel="stylesheet" href="assets/plaza_scene.css?v=1" />
    <link rel="stylesheet" href="assets/world_ui.css?v=3" />
    <link rel="stylesheet" href="assets/friend_cabin.css?v=1" />
    <link rel="stylesheet" href="assets/safety.css?v=1" />
    <link rel="stylesheet" href="assets/scene_room.css?v=3" />
    <link rel="stylesheet" href="assets/game_panel_content.css?v=1" />
    <link rel="stylesheet" href="assets/scenes/social_world/living_room.css?v=1" />
  </head>
  <body class="w-page world-page" data-page="friend-visits" data-social-facility="plaza" data-living-room="friend-visits">
    <header class="w-hud">
      <a data-town-return href="town.html">← 回小鎮</a>
      <h1>好友小屋</h1>
    </header>
    <main class="main w-main" id="sceneMain" tabindex="-1">
        <header class="hero scene-hero">
          <div>
            <h1>到好友公開的場景走走</h1>
            <p>查看好友公開的小屋擺設與角色。每位好友每天可留一則鼓勵和貼圖。</p>
          </div>
          <div class="hero-card">
            <span>今天來訪的好友</span>
            <strong data-visit-today-count>0</strong>

          </div>
        </header>

        <section class="scene-panel visit-settings" aria-labelledby="visitSettingsTitle">
          <span class="eyebrow">My visibility</span>
          <h2 id="visitSettingsTitle">我的拜訪設定</h2>
          <div class="visit-setting-row">
            <label class="visit-toggle"><input type="checkbox" data-visit-allow /><span>開放好友拜訪</span></label>
            <label class="visit-toggle"><input type="checkbox" data-visit-cabin /><span>公開小屋擺設與角色給好友</span></label>
            <label class="visit-scene-select"><span>公開場景</span>
              <select data-visit-scene>
                <option value="cabin">我的小屋</option>
                <option value="garden">專注花園</option>
                <option value="study_corner">讀書角落</option>
              </select>
            </label>
          </div>
          <p class="visit-note" data-visit-setting-status aria-live="polite">登入後可設定。</p>
        </section>

        <section class="scene-panel" aria-labelledby="visitFriendsTitle">
          <span class="eyebrow">Visit a friend</span>
          <h2 id="visitFriendsTitle" tabindex="-1">拜訪好友</h2>
          <div class="visit-friend-grid" data-visit-friends><p class="visit-empty">正在載入正式好友…</p></div>
        </section>

        <section class="planet-depth">
          <article class="event-feed">
            <span class="eyebrow">Visits to you</span>
            <h2>誰來拜訪過我</h2>
            <ul class="timeline compact" data-visit-incoming><li class="visit-empty">載入中…</li></ul>
          </article>
          <article class="event-feed">
            <span class="eyebrow">My visits</span>
            <h2>我拜訪過的好友</h2>
            <ul class="timeline compact" data-visit-outgoing><li class="visit-empty">載入中…</li></ul>
          </article>
        </section>
      </main>
    <dialog class="w-parchment" role="dialog" aria-labelledby="friendCabinTitle" data-friend-cabin-dialog>
      <div class="friend-cabin-header">
        <h2 id="friendCabinTitle">好友的小屋</h2>
        <form method="dialog"><button type="submit" class="w-btn" autofocus>關閉</button></form>
      </div>
      <p data-friend-cabin-status role="status"></p>
      <a class="w-btn" data-thanks-cabin hidden>送感謝卡</a>
      <div class="friend-cabin-stage" data-friend-cabin-stage hidden></div>
      <form data-friend-cabin-letter hidden>
        <h3>留言簿</h3>
        <label>選一句鼓勵 <select name="note" required></select></label>
        <fieldset class="friend-cabin-stickers"><legend>選一張貼圖</legend></fieldset>
        <button type="submit" class="w-btn is-gold">送出留言</button>
      </form>
    </dialog>
    <script src="assets/cabin_core.js?v=1"></script>
    <script src="assets/friend_visits.js?v=3"></script>
    <script src="assets/town_routes.js?v=7"></script>
    <script src="assets/town_return.js?v=2"></script>
    <script src="assets/social_scene.js?v=1"></script>
    <script src="assets/safety_ui.js?v=1"></script>
    <script src="assets/app.js?v=31"></script>
    <script src="assets/sprite_player.js?v=1"></script>
    <script src="assets/npc_dialog.js?v=1"></script>
    <script src="assets/game_sfx.js?v=1"></script>
    <script src="assets/scene_room.js?v=5"></script>
    <script src="assets/scenes/social_world/living_room.js?v=1"></script>
    <script src="assets/scenes/social_world/social_rooms.js?v=1"></script>
    <script src="assets/scenes/social_world/living_page.js?v=1"></script>
  </body>
</html>
