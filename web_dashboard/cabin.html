<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nudge 你的小屋</title>
    <meta name="theme-color" content="#2a1a14" />
    <link rel="stylesheet" href="assets/town.css?v=4" />
    <link rel="stylesheet" href="assets/cabin.css?v=1" />
  </head>
  <body data-page="cabin">
    <main class="cabin" aria-labelledby="cabinTitle">
      <header class="cabin-top">
        <a class="town-ghost cabin-back" data-town-return="cabin" href="town.html">← 返回小鎮</a>
        <h1 id="cabinTitle">你的小屋</h1>
        <span id="cabinCoins" class="cabin-chip">讀取中</span>
      </header>

      <p id="cabinStatus" class="cabin-status" role="status" aria-live="polite">正在讀取你的小屋…</p>

      <section id="cabinScene" class="cabin-scene" hidden>
        <div id="cabinStage" class="cabin-stage" role="img" aria-labelledby="cabinSummary">
          <img id="cabinBase" class="cabin-layer cabin-base" alt="" />
          <div id="cabinLayers"></div>
          <img id="cabinCharacter" class="cabin-layer cabin-character" alt="" />
        </div>
        <p id="cabinSummary" class="cabin-summary"></p>

        <form id="cabinForm" class="cabin-form" aria-describedby="cabinFormHint">
          <p id="cabinFormHint" class="cabin-hint">只能擺放你已擁有的家具。每個位置的第一個選項免費。保存後，其他裝置也會看到同樣的擺設。</p>
          <div id="cabinSlots" class="cabin-slots"></div>
          <div class="cabin-actions">
            <button id="cabinSave" type="submit" class="town-gold" disabled>保存擺設</button>
            <button id="cabinRevert" type="button" class="town-ghost" disabled>復原成雲端版本</button>
            <a class="town-ghost" href="operations.html#decor">到雜貨店買家具</a>
          </div>
          <p id="cabinSaveStatus" class="cabin-save-status" role="status" aria-live="polite"></p>
        </form>

        <p class="cabin-hint">想專注的話，<a data-town-return="cabin" href="town.html">回到小鎮的小屋門口</a>，打開「坐到書桌前專注」。</p>
      </section>
    </main>

    <script src="assets/town_routes.js?v=2"></script>
    <script src="assets/town_return.js?v=1"></script>
    <script src="assets/cabin_core.js?v=1"></script>
    <script src="assets/cabin.js?v=1"></script>
    <script src="assets/app.js?v=27"></script>
  </body>
</html>
