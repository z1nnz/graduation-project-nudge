<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nudge 專注書桌</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <link rel="stylesheet" href="assets/town_chrome.css?v=1" />
    <link rel="stylesheet" href="assets/world_ui.css?v=3" />
    <script defer src="assets/town_routes.js?v=6"></script>
    <script defer src="assets/town_return.js?v=2"></script>
  </head>
  <body class="w-page world-page" data-page="personal">
    <header class="w-hud"><a data-town-return href="town.html">← 回小鎮</a><h1>專注書桌</h1></header>
    <div class="world-shell">

      <main class="main w-main" style="position: relative; z-index: 10;">
        <header class="hero split">
          <div>
            <span class="eyebrow">小屋書桌</span>
            <h1>和夥伴一起讀書</h1>
            <p>選一段時間，專心完成眼前的一件事。活動先送入 Cloud Ledger，獎勵由雲端確認。</p>
            <div class="subnav" style="margin-bottom: 24px;">
              <a href="personal.html">中心總覽</a>
              <a href="personal-trends.html">趨勢</a>
              <a href="personal-pressure.html">壓力雷達</a>
              <a href="personal-weather.html">自律天氣</a>
              <a href="personal-time-capsule.html">時間膠囊</a>
              <a href="personal-letter.html">未來的信</a>
              <a href="personal-skill-tree.html">人生技能樹</a>
            </div>
          </div>
        </header>

        <section class="focus-timer-section page-section">
          <div class="focus-timer-container">
            <div class="focus-presets" role="group" aria-label="專注與休息時間">
              <button class="button primary" type="button" data-focus-mins="25" aria-pressed="true">專注 25 分鐘 · 休息 5 分鐘</button>
              <button class="button ghost" type="button" data-focus-mins="50" aria-pressed="false">專注 50 分鐘 · 休息 10 分鐘</button>
            </div>
            <div class="timer-display" id="focusTimerDisplay">25:00</div>
            <p class="timer-status" id="focusTimerStatus">坐下來，準備好就開始。</p>
            <div class="timer-controls">
              <button class="button primary" id="btnStartFocus">開始專注</button>
              <button class="button secondary" id="btnPauseFocus" style="display: none;">暫停</button>
              <button class="button ghost" id="btnStopFocus" style="display: none;">結束這一輪</button>
            </div>
            <p id="focusSettlement" class="focus-settlement" role="status" hidden></p>
          </div>
        </section>
      </main>

      <div class="focus-ambient" id="hyperdriveBg" aria-hidden="true"></div>
    </div>
    <script src="assets/app.js?v=30"></script>
    <script src="assets/confirmed_activity_feedback.js?v=1"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        let focusMins = parseInt(urlParams.get('focus'), 10) || 25;
        const autoStart = urlParams.get('start') === 'true';

        let totalSeconds = focusMins * 60;
        let timeLeft = totalSeconds;
        let timerId = null;
        let sessionId = null;
        let timerState = 'idle';
        let unsubscribeReceipt = null;
        const display = document.getElementById('focusTimerDisplay');
        const status = document.getElementById('focusTimerStatus');
        const btnStart = document.getElementById('btnStartFocus');
        const btnPause = document.getElementById('btnPauseFocus');
        const btnStop = document.getElementById('btnStopFocus');
        const hyperdriveBg = document.getElementById('hyperdriveBg');
        const settlement = document.getElementById('focusSettlement');
        const presets = [...document.querySelectorAll('[data-focus-mins]')];
        const setPresetAvailability = enabled => presets.forEach(button => { button.disabled = !enabled; });
        presets.forEach(button => {
          button.setAttribute('aria-pressed', String(Number(button.dataset.focusMins) === focusMins));
          button.addEventListener('click', () => {
            if (timerState !== 'idle') return;
            focusMins = Number(button.dataset.focusMins);
            totalSeconds = focusMins * 60;
            timeLeft = totalSeconds;
            presets.forEach(choice => choice.setAttribute('aria-pressed', String(choice === button)));
            settlement.hidden = true;
            updateDisplay();
          });
        });

        const updateDisplay = () => {
          const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
          const s = (timeLeft % 60).toString().padStart(2, '0');
          display.textContent = `${m}:${s}`;
        };
        updateDisplay();

        const watchCompletedReceipt = completedSessionId => {
          unsubscribeReceipt?.();
          const userId = window.firebase?.auth()?.currentUser?.uid;
          if (!userId) return;
          unsubscribeReceipt = window.firebase.firestore().collection('activity_receipts')
            .where('actorUserId', '==', userId)
            .where('activitySessionId', '==', completedSessionId)
            .limit(5)
            .onSnapshot({ includeMetadataChanges: true }, snapshot => {
              if (window.firebase.auth().currentUser?.uid !== userId || snapshot.metadata.hasPendingWrites) return;
              const confirmed = snapshot.docs.some(doc =>
                window.NudgeConfirmedActivityFeedback?.parse(doc.id, doc.data(), userId));
              if (!confirmed) return;
              settlement.textContent = '✓ 活動紀錄已由雲端確認；獎勵仍以雲端獎勵帳本為準。';
              unsubscribeReceipt?.();
              unsubscribeReceipt = null;
            }, () => {
              settlement.textContent = '暫時無法讀取雲端確認，連線恢復後再查看。';
            });
        };

        const queueLedger = async (eventType) => {
          if (typeof window.queueWebStandaloneFocusLedgerEvent !== 'function') {
            throw new Error('Activity Ledger 尚未載入，請稍後再試。');
          }
          await window.queueWebStandaloneFocusLedgerEvent({
            sessionId,
            eventType,
            elapsedSeconds: totalSeconds - timeLeft,
            occurredAt: new Date(),
          });
        };

        const startTimer = async () => {
          if (timerId) return;
          const isResume = timerState === 'paused';
          if (!sessionId) {
            sessionId = `web_focus_${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;
          }
          try {
            btnStart.disabled = true;
            await queueLedger(isResume ? 'resumed' : 'started');
          } catch (error) {
            btnStart.disabled = false;
            status.textContent = error.message || '無法保存專注事件，請確認已登入。';
            status.style.color = '#ff3333';
            if (!isResume) sessionId = null;
            return;
          }
          btnStart.disabled = false;
          timerState = 'active';
          unsubscribeReceipt?.();
          unsubscribeReceipt = null;
          settlement.hidden = true;
          setPresetAvailability(false);
          hyperdriveBg.classList.add('active');
          btnStart.style.display = 'none';
          btnPause.style.display = 'inline-flex';
          btnStop.style.display = 'inline-flex';
          status.textContent = '專注中，夥伴陪你讀書。';
          status.style.color = 'var(--w-gold)';

          timerId = setInterval(() => {
            timeLeft--;
            updateDisplay();
            if (timeLeft <= 0) {
              finishTimer(
                'completed',
                '專注完成！活動已送入 Cloud Ledger。',
                'var(--w-green)',
              );
            }
          }, 1000);
        };

        const pauseTimer = async () => {
          try {
            await queueLedger('paused');
          } catch (error) {
            status.textContent = error.message || '無法保存暫停事件。';
            status.style.color = '#ff3333';
            return;
          }
          clearInterval(timerId);
          timerId = null;
          timerState = 'paused';
          hyperdriveBg.classList.remove('active');
          btnStart.style.display = 'inline-flex';
          btnPause.style.display = 'none';
          btnStart.textContent = '繼續專注';
          status.textContent = '已暫停，準備好再繼續。';
          status.style.color = 'var(--w-gold)';
        };

        const finishTimer = async (eventType, message, color) => {
          clearInterval(timerId);
          timerId = null;
          try {
            await queueLedger(eventType);
            if (eventType === 'completed') {
              settlement.textContent = '專注完成！活動已送出，獎勵由雲端確認中。';
              settlement.hidden = false;
              watchCompletedReceipt(sessionId);
            }
          } catch (error) {
            message = error.message || '活動已停止，但 Ledger 尚未保存。';
            color = 'var(--w-red)';
            settlement.hidden = true;
          }
          timerState = 'idle';
          sessionId = null;
          timeLeft = totalSeconds;
          updateDisplay();
          hyperdriveBg.classList.remove('active');
          setPresetAvailability(true);
          btnStart.style.display = 'inline-flex';
          btnPause.style.display = 'none';
          btnStop.style.display = 'none';
          btnStart.textContent = '開始專注';
          status.textContent = message;
          status.style.color = color;
        };

        btnStart.addEventListener('click', startTimer);
        btnPause.addEventListener('click', pauseTimer);
        btnStop.addEventListener('click', () => {
          finishTimer('discarded', '這一輪已結束，不會送出完成獎勵。', 'var(--w-red)');
        });

        if (autoStart) {
          document.addEventListener('firebase-ready', startTimer, { once: true });
        }
        window.addEventListener('pagehide', () => unsubscribeReceipt?.(), { once: true });
      });
    </script>
  </body>
</html>
