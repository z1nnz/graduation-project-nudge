<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nudge 夥伴小鎮</title>
    <meta name="theme-color" content="#2a1a14" />
    <link rel="stylesheet" href="assets/town.css?v=1" />
  </head>
  <body data-page="town">
    <a class="town-skip" href="#townDirectory">跳到建築列表</a>
    <main class="town" aria-label="Nudge 夥伴小鎮">
      <canvas id="townCanvas" class="town-canvas" aria-hidden="true"></canvas>
      <div id="townLabels" class="town-labels" aria-hidden="true"></div>

      <header class="town-hud town-hud-identity">
        <img id="townAvatar" class="town-avatar" alt="" src="assets/avatar/characters/character_0.png" />
        <div>
          <strong id="townName">訪客</strong>
          <span id="townLevel">Lv 1・登入後同步</span>
        </div>
      </header>

      <nav class="town-hud town-hud-tools" aria-label="小鎮工具">
        <a href="notifications.html" title="通知" aria-label="通知">🔔</a>
        <a href="profile.html" title="個人資料" aria-label="個人資料">👤</a>
        <a href="dashboard.html" title="傳統版面" aria-label="切換到傳統版面">▤</a>
        <button id="townHelp" type="button" title="導覽" aria-label="重新開始導覽">?</button>
      </nav>

      <div class="town-hud town-hud-clock" id="townClock" aria-hidden="true">--:--</div>
      <div class="town-hud town-hud-ticket" id="townTicket" hidden></div>

      <div class="town-hud town-hud-zoom">
        <button id="townZoomIn" type="button" aria-label="放大">＋</button>
        <button id="townZoomOut" type="button" aria-label="縮小">－</button>
      </div>

      <div id="townPrompt" class="town-prompt" hidden>
        <span id="townPromptText"></span>
        <button id="townPromptEnter" type="button">進入</button>
      </div>

      <div id="townToast" class="town-toast" role="status" aria-live="polite" hidden></div>

      <section id="townDialog" class="town-dialog" hidden aria-live="polite">
        <img src="assets/town/guide.png" alt="" class="town-dialog-portrait" />
        <div class="town-dialog-body">
          <span class="town-dialog-name">貓頭鷹館長・歐莉</span>
          <p id="townDialogText"></p>
          <div class="town-dialog-actions">
            <button id="townDialogSkip" type="button" class="town-ghost">略過導覽 <kbd>Esc</kbd></button>
            <span id="townDialogStep"></span>
            <button id="townDialogNext" type="button" class="town-gold">繼續 <kbd>Space</kbd></button>
          </div>
        </div>
      </section>

      <section id="townGame" class="town-game" hidden aria-label="休息小遊戲：接星星">
        <div class="town-game-bar">
          <strong>接星星</strong>
          <span id="townGameScore">0 顆</span>
          <span id="townGameTime">5:00</span>
          <button id="townGameClose" type="button" class="town-ghost">結束休息</button>
        </div>
        <canvas id="townGameCanvas" class="town-game-canvas"></canvas>
        <p class="town-game-hint">左右鍵、滑鼠或手指移動角色。遊戲分數不換自律幣或經驗值。</p>
      </section>

      <section id="townDirectory" class="town-directory" aria-label="小鎮建築列表">
        <h2>小鎮建築</h2>
        <ul id="townDirectoryList"></ul>
      </section>
    </main>

    <script src="assets/confirmed_activity_feedback.js?v=1"></script>
    <script src="assets/town_core.js?v=1"></script>
    <script src="assets/town.js?v=1"></script>
    <script src="assets/app.js?v=27"></script>
  </body>
</html>
