<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nudge 團體會館</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <link rel="stylesheet" href="assets/social-scenes.css?v=1" />
    <link rel="stylesheet" href="assets/social_scene.css?v=1" />
    <link rel="stylesheet" href="assets/world_ui.css?v=3" />
    <link rel="stylesheet" href="assets/guild_calendar.css?v=1" />
    <link rel="stylesheet" href="assets/safety.css?v=1" />
    <link rel="stylesheet" href="assets/community_ground.css?v=fb3" />
    <link rel="stylesheet" href="assets/scene_room.css?v=3" />
    <link rel="stylesheet" href="assets/game_panel_content.css?v=1" />
    <link rel="stylesheet" href="assets/scenes/social_world/living_room.css?v=1" />
  </head>
  <body class="w-page world-page" data-page="group-hall" data-social-facility="guild" data-living-room="group-hall">
    <header class="w-hud">
      <a data-town-return href="town.html">← 回小鎮</a>
      <h1>團體會館</h1>
    </header>
    <main class="w-main main" id="sceneMain" tabindex="-1">
        <section class="community-ground community-ground--guild" data-community-ground aria-label="團體會館">
          <span class="community-spark" aria-hidden="true">✦</span><span class="community-light" aria-hidden="true"></span>
          <button class="w-btn community-stop" type="button" data-community-open="calendar" style="--w-x:23%;--w-y:67%" aria-label="活動日曆">活動日曆</button>
          <button class="w-btn community-stop" type="button" data-community-open="challenge" style="--w-x:68%;--w-y:30%" aria-label="團體挑戰">團體挑戰</button>
          <button class="w-btn community-stop" type="button" data-community-open="office" disabled style="--w-x:81%;--w-y:67%" aria-label="辦公室">辦公室</button>
          <button class="w-btn community-stop community-host" type="button" data-community-open="guide" aria-label="會館嚮導" aria-haspopup="dialog"><span class="community-actor" aria-hidden="true"></span>會館嚮導</button>
        </section>
        <header class="community-scope">
          <div>
            <span class="eyebrow">Group Hall</span>
            <h1>一起約好，各自出發</h1>
            <p>管理者提出挑戰、共同時段與模板；成員自己決定是否參與、何時打卡，以及要不要分享成果摘要。</p>
          </div>
          <div class="hero-card">
            <span>切換團體</span>
            <label class="sr-only" for="socialScopePicker">選擇團體</label>
            <select id="socialScopePicker" data-social-scope-picker hidden></select>
            <p>管理者無法替成員打卡或讀取未分享的個人資料。</p>
          </div>
        </header>
        <div data-community-panel="calendar" tabindex="-1" hidden>
        <section class="guild-calendar w-parchment" data-guild-calendar hidden aria-labelledby="guildCalendarTitle">
          <button class="w-btn" type="button" data-community-return>回會館</button>
          <header>
            <h2 id="guildCalendarTitle">團體活動行事曆</h2>
            <div class="guild-calendar-tools">
              <button type="button" class="w-btn" data-guild-view-month>月檢視</button>
              <button type="button" class="w-btn" data-guild-view-week>週檢視</button>
            </div>
          </header>
          <div class="guild-calendar-tools">
            <button type="button" class="w-btn" data-guild-prev>上一期</button>
            <strong data-guild-range></strong>
            <button type="button" class="w-btn" data-guild-next>下一期</button>
          </div>
          <div class="guild-calendar-grid" data-guild-grid aria-label="活動日期"></div>
          <div class="guild-calendar-list" data-guild-calendar-list aria-label="活動清單"></div>
          <div data-guild-event-details tabindex="-1"></div>
          <p role="status" tabindex="-1" data-guild-status></p>
          <section aria-labelledby="guildNoticesTitle">
            <h3 id="guildNoticesTitle">公告板</h3>
            <ul data-guild-notices class="guild-calendar-notices"></ul>
          </section>
          <div data-guild-manager hidden>
            <details>
              <summary>安排團體活動</summary>
              <form data-guild-event-form>
                <label>活動名稱 <input name="title" maxlength="80" required /></label>
                <label>活動類型 <select name="kind"><option value="study">共同自習</option><option value="book">讀書會</option><option value="exam">考前衝刺夜</option></select></label>
                <label>開始（當地時間） <input name="starts" type="datetime-local" required /></label>
                <label>結束（當地時間） <input name="ends" type="datetime-local" required /></label>
                <label class="guild-check"><input name="voice" type="checkbox" /> 臨時房開放語音</label>
                <button type="submit" class="w-btn is-gold">公布活動</button>
              </form>
            </details>
            <details>
              <summary>新增釘選公告</summary>
              <form data-guild-notice-form>
                <label>公告 <textarea name="body" maxlength="300" required></textarea></label>
                <button type="submit" class="w-btn is-gold">釘選公告</button>
              </form>
            </details>
          </div>
        </section>
        </div>

        <section class="w-parchment" data-community-panel="challenge" hidden tabindex="-1">
          <button class="w-btn" type="button" data-community-return>回會館</button>
          <h2>團體挑戰壁畫</h2>
          <p data-community-mural-status>等候目前的挑戰。</p>
          <div class="community-mural" data-community-mural aria-hidden="true"></div>
          <a class="w-btn" href="groups.html">查看共同挑戰與參與進度</a>
        </section>
        <section class="w-parchment" data-community-panel="office" hidden tabindex="-1">
          <button class="w-btn" type="button" data-community-return>回會館</button>
          <h2>管理員辦公室</h2>
          <button type="button" class="w-btn" data-safety-group-manage hidden>成員管理</button>
          <a class="w-btn" href="groups-challenge.html">團體挑戰建立器</a>
          <a class="w-btn" href="groups-study-schedule.html">讀書時段管理</a>
        </section>
        <a class="w-btn" href="clubs.html">社團佈告欄</a>
        <div data-social-scene aria-live="polite"><p class="visit-empty">載入中…</p></div>
      </main>
    <script src="assets/relationship_membership_contract.js?v=1"></script>
    <script src="assets/family_link_contract.js?v=1"></script>
    <script src="assets/guild_calendar_core.js?v=1"></script>
    <script src="assets/guild_calendar.js?v=1"></script>
    <script src="assets/family_group_scenes.js?v=4"></script>
    <script src="assets/town_routes.js?v=7"></script>
    <script src="assets/town_return.js?v=2"></script>
    <script src="assets/social_scene.js?v=1"></script>
    <script src="assets/safety_ui.js?v=1"></script>
    <script src="assets/app.js?v=31"></script>
    <script src="assets/game_sfx.js?v=1"></script>
    <script src="assets/scene_room.js?v=5"></script>
    <script src="assets/scenes/social_world/living_room.js?v=1"></script>
    <script src="assets/scenes/social_world/social_rooms.js?v=1"></script>
    <script src="assets/scenes/social_world/living_page.js?v=1"></script>
    <script src="assets/sprite_player.js?v=1"></script>
    <script src="assets/npc_dialog.js?v=1"></script>
    <script src="assets/community_ground.js?v=2"></script>
  </body>
</html>
