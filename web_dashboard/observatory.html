<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nudge 天文台虛擬裝置</title><link rel="stylesheet" href="assets/world_ui.css?v=2"><link rel="stylesheet" href="assets/growth_world.css?v=1"><link rel="stylesheet" href="assets/observatory.css?v=1"><script defer src="assets/virtual_orbit_core.js?v=1"></script><script defer src="assets/growth_world.js?v=1"></script><script defer src="assets/observatory.js?v=1"></script></head>
<body class="w-page world-page" data-growth-museum="observatory"><header class="w-hud"><a data-town-return="observatory" href="town.html">← 回小鎮</a><h1>天文台 · 虛擬裝置</h1></header><main class="w-main"><nav class="growth-nav" aria-label="天文台"><a href="planet.html">自律星球</a></nav><section class="observatory-demo"><h2>示範 · 網頁上的 Orbit 與 Station</h2><p>25／50 分鐘都縮短為 20 秒。畫面沿用韌體繪圖與固定示範內容，不代表本人資料，不寫入活動、金幣或經驗值。</p><p>滾輪或水平拖曳旋鈕選時間；短按開始，專注中按住 1 秒完成。鍵盤可用左右鍵及空白鍵，也可使用下方按鈕。</p><p id="virtualStatus" role="status" aria-live="polite">示範待命。</p></section>
<div class="observatory-devices"><figure class="observatory-device"><figcaption>Orbit · 240 × 240 圓形螢幕</figcaption><div class="device-stage is-orbit"><img id="orbitScreen" class="device-screen" width="240" height="240" alt="Orbit 韌體示範待命"><img class="device-case" src="assets/growth/orbit-case.png" alt="" width="320" height="400"><span class="device-light" aria-hidden="true"></span></div></figure><figure class="observatory-device"><figcaption>Station · 240 × 320 螢幕</figcaption><div class="device-stage is-station"><img id="stationScreen" class="device-screen" width="240" height="320" alt="Station 韌體示範待命"><img class="device-case" src="assets/growth/station-case.png" alt="" width="320" height="420"><span class="device-light" aria-hidden="true"></span></div></figure></div>
<div class="growth-controls observatory-controls"><button id="orbitKnob" type="button" class="orbit-knob" aria-label="模擬旋鈕">旋鈕</button><strong id="virtualMinutes" class="growth-number">25 分鐘</strong><span id="virtualCountdown" class="growth-number">待命</span><button id="virtual25" class="w-btn" type="button">25 分鐘</button><button id="virtual50" class="w-btn" type="button">50 分鐘</button><button id="virtualStart" class="w-btn is-gold" type="button">開始示範</button><button id="virtualComplete" class="w-btn" type="button" disabled>完成示範（長按替代）</button><button id="virtualReset" class="w-btn" type="button">重設示範</button></div>
<section class="w-panel device-bindings"><h2>本人的裝置綁定</h2><p id="growthStatus" class="growth-status" role="status" aria-live="polite">登入後讀取本人裝置綁定。</p><div id="deviceBinding"></div><p>實體裝置請透過 Android App 以藍牙連線。網頁示範與實際綁定無關；這裡不提供藍牙配對或認領功能。</p></section></main><script src="assets/town_routes.js?v=5"></script><script src="assets/town_return.js?v=2"></script></body></html>
