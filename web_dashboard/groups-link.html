      <aside class="sidebar">
        <a class="brand" href="index.html">
          <span class="brand-mark">N</span>
          <span><strong>Nudge</strong><small>團體管理</small></span>
        </a>
        <nav class="nav">

          <a href="profile.html">個人名片</a>
        </nav>
      </aside>
      <main class="main">
        <header class="hero split">
          <div>
            <span class="eyebrow">Organization Joining</span>
            <h1>加入或創建你的自律團體。</h1>
            <p>透過團體 ID 快速加入已有班級、企業或讀書會，或在此處一鍵創建專屬團體以啟用管理功能。</p>
            <div class="subnav">
              <a href="groups.html">中心總覽</a>
              <a href="groups-challenge.html">挑戰建立</a>
              <a href="groups-study-schedule.html">讀書時段</a>
              <a href="groups-ranking.html">排行與週報</a>
              <a href="groups-templates.html">考試模板</a>
            </div>
          </div>
          <div class="hero-card">
            <span>自律團體狀態</span>
            <strong id="groupsBindStatusText">未連結</strong>
            <p>加入後可共享學習排程與數據。</p>
          </div>
        </header>

        <section id="groupsLinkContainer" class="page-section" style="max-width: 600px; margin: 34px auto 0;">
          <div id="webBindingGatedCard" class="panel" style="padding: 30px;">
            <span class="eyebrow">Group Linking</span>
            <h2>👥 團體自律組織連結</h2>
            <p style="margin-bottom: 24px;">請先創建新的自律團體（獲取最高房主權限並生成團體 ID），或輸入已有組織 ID 加入，以解鎖專注挑戰、共同目標等功能：</p>
            
            <div class="web-binding-form" style="margin-bottom: 24px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 24px; display: flex; flex-direction: column; gap: 14px;">
              <input type="text" id="webGroupNameInput" class="module-select" style="background: rgba(255,255,255,0.05); color: #fff; text-align: left; font-family: inherit;" placeholder="輸入要創建的團體名稱 (例如: 皇家自律班)">
              <button id="webGroupCreateBtn" class="button primary" style="width: 100%; border-radius: 12px; font-weight: 700;">創建新團體並獲取房主權限</button>
            </div>
            
            <div class="web-binding-form" style="display: flex; flex-direction: column; gap: 14px;">
              <input type="text" id="webGroupIdInput" class="module-select" style="background: rgba(255,255,255,0.05); color: #fff; text-align: left; font-family: inherit;" placeholder="輸入已有團體組織 ID (格式如: GRP-88921)">
              <button id="webGroupJoinBtn" class="button secondary" style="width: 100%; border-radius: 12px; font-weight: 700;">輸入 ID 連結並加入</button>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="assets/app.js?v=3"></script>
