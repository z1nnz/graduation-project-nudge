<!doctype html>
<html lang="zh-Hant">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Nudge 考試倒數模板</title><link rel="stylesheet" href="assets/styles.css?v=17" />
    <link rel="stylesheet" href="assets/social_scene.css?v=1" />
    <link rel="stylesheet" href="assets/world_ui.css?v=3" />
    <link rel="stylesheet" href="assets/scene_room.css?v=3" />
    <link rel="stylesheet" href="assets/game_panel_content.css?v=1" />
    <link rel="stylesheet" href="assets/scenes/social_world/living_room.css?v=1" /></head>
  <body class="w-page world-page" data-page="groups" data-social-facility="guild" data-living-room="groups-templates">
    <header class="w-hud"><a data-town-return href="town.html">← 回小鎮</a><h1>考試倒數模板</h1></header>
    <main class="main w-main" id="sceneMain" tabindex="-1">
        <header class="hero scene-hero"><div><span class="eyebrow">Exam Templates</span><h1>建立考試倒數與複習提醒模板。</h1><p>給老師或讀書會管理員快速派發複習任務。</p></div><div class="hero-card"><span>正式模板</span><strong data-count="0">0</strong><p>由目前團體資料同步。</p></div></header>
        <section class="program-builder">
          <div class="template-form-container">
            <span class="eyebrow">課程 / 挑戰編排器</span>
            <h2>新增倒數模板</h2>
            <p style="margin-top: 8px;">自訂班級或小組的複習節奏，並派發給成員。</p>
            <div class="field" style="margin-top: 24px;">
              <span>模板天數</span>
              <input type="number" min="1" max="365" value="7" data-template-days>
            </div>
            <div class="field" style="margin-top: 14px;">
              <span>模板標題</span>
              <input type="text" data-template-title placeholder="輸入模板名稱">
            </div>
            <div class="field" style="margin-top: 14px;">
              <span>核心任務</span>
              <textarea data-template-desc rows="2" placeholder="例如：完成三回模擬題並整理錯題"></textarea>
            </div>
            <div class="field" style="margin-top: 14px;">
              <span>成員執行策略</span>
              <textarea data-template-strategy rows="2" placeholder="例如：每日自行安排 50 分鐘，不需等待管理者開場"></textarea>
            </div>
            <button type="button" class="button primary" data-action="add-template" style="margin-top: 18px; width: 100%;">發布並同步到成員 App</button>
          </div>
          <div class="program-grid" data-template-list>
            <!-- 透過 app.js 動態渲染 -->
          </div>
        </section>
      </main>    <script src="assets/town_routes.js?v=7"></script>

<script src="assets/app.js?v=31"></script>

    <script src="assets/game_sfx.js?v=1"></script>
    <script src="assets/scene_room.js?v=5"></script>
    <script src="assets/scenes/social_world/living_room.js?v=1"></script>
    <script src="assets/scenes/social_world/social_rooms.js?v=1"></script>
    <script src="assets/scenes/social_world/living_page.js?v=1"></script>
  </body>
</html>
