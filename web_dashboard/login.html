<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nudge - 登入 / 註冊</title>
    <link rel="stylesheet" href="assets/styles.css?v=13" />
    <!-- Firebase Compat SDK for real-time Firebase Auth and Firestore sync -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
      .login-page {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        position: relative;
        z-index: 1;
      }
      .login-card {
        width: 100%;
        max-width: 440px;
        padding: 40px;
        text-align: center;
      }
      .login-title {
        font-size: 32px;
        margin-bottom: 12px;
        font-weight: 900;
        letter-spacing: 2px;
      }
      .login-subtitle {
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 30px;
      }
      .auth-tabs {
        display: flex;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 999px;
        padding: 4px;
        margin-bottom: 24px;
      }
      .auth-tab {
        flex: 1;
        padding: 12px;
        border-radius: 999px;
        color: var(--muted);
        font-weight: 800;
        cursor: pointer;
        transition: 200ms ease;
      }
      .auth-tab.active {
        background: var(--page-wash);
        color: var(--page-accent);
      }
      .input-group {
        display: flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 0 16px;
        margin-bottom: 16px;
        transition: 200ms ease;
      }
      .input-group:focus-within {
        border-color: var(--page-accent);
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
      }
      .field-icon {
        width: 22px;
        height: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        margin-right: 12px;
        flex: 0 0 auto;
      }
      .field-icon svg,
      .toggle-pwd svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .input-group input {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--text);
        padding: 16px 0;
        font-size: 15px;
        outline: none;
      }
      .input-group .toggle-pwd {
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin: 0 -8px 0 8px;
        padding: 0;
        cursor: pointer;
        color: var(--muted);
        transition: 180ms ease;
      }
      .input-group .toggle-pwd:hover {
        color: var(--page-accent);
        background: rgba(255, 255, 255, 0.06);
      }
      .submit-btn {
        width: 100%;
        margin-top: 8px;
        padding: 16px;
        font-size: 16px;
        border-radius: 16px;
      }
      .divider {
        display: flex;
        align-items: center;
        margin: 24px 0;
        color: var(--muted);
        font-size: 12px;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
        margin: 0 12px;
      }
      .social-login {
        display: flex;
        gap: 16px;
        margin-bottom: 30px;
      }
      .social-btn {
        flex: 1;
        padding: 14px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--line);
        color: var(--text);
        font-weight: 800;
        cursor: pointer;
        transition: 200ms ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .social-btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .skip-link {
        color: var(--muted);
        text-decoration: underline;
        font-size: 13px;
        cursor: pointer;
      }
      .skip-link:hover {
        color: var(--text);
      }
    </style>
  </head>
  <body data-page="home">
    <div class="login-page">
      <div class="panel login-card">
        <h1 class="login-title" id="loginTitle">建立你的自律身分</h1>
        <p class="login-subtitle" id="loginSubtitle">同步你的進度，與全球好友一同專注</p>

        <!-- Error Message Banner -->
        <div id="errorMsg" style="display: none; color: #ff4a5a; background: rgba(255, 74, 90, 0.1); border: 1px solid rgba(255, 74, 90, 0.2); padding: 12px; border-radius: 12px; margin-bottom: 20px; font-size: 14px; font-weight: 700; text-align: center;"></div>

        <div class="auth-tabs">
          <div class="auth-tab" id="tabLogin">登入</div>
          <div class="auth-tab active" id="tabRegister">註冊</div>
        </div>

        <form id="loginForm">
          <!-- Nickname is set after login in profile settings, not during registration -->
          <div class="input-group">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z" /><path d="m4 7 8 6 8-6" /></svg>
            </span>
            <input type="email" placeholder="電子郵件" required />
          </div>
          <div class="input-group">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg>
            </span>
            <input type="password" id="inputPassword" placeholder="密碼" required />
            <button class="toggle-pwd" type="button" aria-label="顯示密碼" aria-pressed="false" data-visible="false">
              <svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" /><circle cx="12" cy="12" r="3" /></svg>
            </button>
          </div>
          <div class="input-group" id="groupConfirm">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg>
            </span>
            <input type="password" id="inputConfirmPassword" placeholder="確認密碼" required />
            <button class="toggle-pwd" type="button" aria-label="顯示確認密碼" aria-pressed="false" data-visible="false">
              <svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" /><circle cx="12" cy="12" r="3" /></svg>
            </button>
          </div>

          <button type="submit" class="button primary submit-btn" id="submitBtn">建立帳號並登入</button>
        </form>

        <div class="divider" style="margin: 20px 0 16px;">或使用社群帳號登入</div>
        <div class="social-login" style="margin-bottom: 12px;">
          <button type="button" class="social-btn" id="btnGoogle">
            <svg width="18" height="18" viewBox="0 0 24 24" style="flex-shrink:0"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Google
          </button>
          <button type="button" class="social-btn" id="btnApple">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
            Apple
          </button>
        </div>
        <div class="social-login" style="margin-bottom: 24px;">
          <button type="button" class="social-btn" id="btnFacebook" style="background: rgba(24, 119, 242, 0.15); border-color: rgba(24, 119, 242, 0.4);">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2" style="flex-shrink:0"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            <span style="color: #1877F2; font-weight: 800;">繼續使用 Facebook</span>
          </button>
        </div>

        <a href="dashboard.html" class="skip-link" id="previewModeLink">稍後再說，先體驗功能</a>
      </div>
    </div>
    <script>
      // Firebase Config
      const firebaseConfig = {
        apiKey: "AIzaSyCsvP-r0EygpkhH0Zwzfrl4uFzy6LcbsTQ",
        authDomain: "nudge-discipline-app.firebaseapp.com",
        projectId: "nudge-discipline-app",
        storageBucket: "nudge-discipline-app.firebasestorage.app",
        messagingSenderId: "497972469632",
        appId: "1:497972469632:web:cb87819a70c7cb8f2f6b65"
      };

      // Initialize Firebase
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      const auth = firebase.auth();
      const authReady = auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch((err) => {
        console.warn("Auth persistence setup failed:", err);
      });

      document.getElementById('previewModeLink').addEventListener('click', () => {
        localStorage.setItem('nudgePreviewMode', 'true');
        localStorage.setItem('nudgePreviewRole', 'personal');
        localStorage.setItem('nudgeActiveDemoUserId', 'preview-user');
        localStorage.removeItem('nudgeWebLoggedIn');
      });
      const db = firebase.firestore();

      // Show/Hide Error Helper
      function showError(msg) {
        const errDiv = document.getElementById('errorMsg');
        if (msg) {
          errDiv.textContent = msg;
          errDiv.style.display = 'block';
        } else {
          errDiv.style.display = 'none';
        }
      }

      // Sync user profile to Firestore (creates it if missing)
      function syncUserProfile(user, nickname) {
        showError("");
        const userRef = db.collection("users").doc(user.uid);
        return userRef.get().then((docSnap) => {
          if (!docSnap.exists) {
            const now = firebase.firestore.FieldValue.serverTimestamp();
            return userRef.set({
              id: user.uid,
              email: user.email,
              nickname: nickname || "自律使用者",
              myNudgeId: 'NDG_' + user.uid.substring(0, 6).toUpperCase(),
              username: 'NDG_' + user.uid.substring(0, 6).toUpperCase(),
              planetCount: 0,
              weeklyPlanetEarned: false,
              tasks: [],
              dailySummaries: [],
              createdAt: now,
              updatedAt: now
            }, { merge: true });
          }
        }).then(() => {
          localStorage.removeItem('nudgePreviewMode');
          localStorage.removeItem('nudgePreviewRole');
          localStorage.setItem('nudgeWebLoggedIn', 'true');
          localStorage.setItem('nudgeActiveDemoUserId', user.uid);
          const redirectTarget = localStorage.getItem('nudgePostLoginRedirect') || 'dashboard.html';
          localStorage.removeItem('nudgePostLoginRedirect');
          window.location.href = redirectTarget;
        }).catch((err) => {
          console.error("Firestore sync error:", err);
          showError("同步使用者資料失敗：" + err.message);
        });
      }

      // Password visibility toggler
      const eyeIcon = '<svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" /><circle cx="12" cy="12" r="3" /></svg>';
      const eyeOffIcon = '<svg viewBox="0 0 24 24"><path d="m3 3 18 18" /><path d="M10.6 10.6A2 2 0 0 0 13.4 13.4" /><path d="M9.8 5.3A9.7 9.7 0 0 1 12 5c6 0 9.5 7 9.5 7a16.3 16.3 0 0 1-3.2 4.1" /><path d="M6.6 6.7C3.9 8.5 2.5 12 2.5 12s3.5 7 9.5 7a9.8 9.8 0 0 0 4.4-1" /></svg>';
      document.querySelectorAll('.toggle-pwd').forEach(toggle => {
        toggle.addEventListener('click', () => {
          const input = toggle.previousElementSibling;
          const shouldShow = input.type === 'password';
          input.type = shouldShow ? 'text' : 'password';
          toggle.dataset.visible = String(shouldShow);
          toggle.setAttribute('aria-pressed', String(shouldShow));
          toggle.setAttribute('aria-label', shouldShow ? '隱藏密碼' : '顯示密碼');
          toggle.innerHTML = shouldShow ? eyeOffIcon : eyeIcon;
        });
      });

      // Tab switching logic
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const groupConfirm = document.getElementById('groupConfirm');
      const loginTitle = document.getElementById('loginTitle');
      const loginSubtitle = document.getElementById('loginSubtitle');
      const submitBtn = document.getElementById('submitBtn');
      
      const confirmInput = document.getElementById('inputConfirmPassword');

      let isLoginMode = false; // Default is register mode (tabRegister active)

      tabLogin.addEventListener('click', () => {
        isLoginMode = true;
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        
        groupConfirm.style.display = 'none';
        confirmInput.required = false;
        
        loginTitle.textContent = '歡迎回來';
        loginSubtitle.textContent = '繼續你的自律旅程';
        submitBtn.textContent = '登入';
        showError("");
      });

      tabRegister.addEventListener('click', () => {
        isLoginMode = false;
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        
        groupConfirm.style.display = 'flex';
        confirmInput.required = true;
        
        loginTitle.textContent = '建立你的自律身分';
        loginSubtitle.textContent = '同步你的進度，與全球好友一同專注';
        submitBtn.textContent = '建立帳號並登入';
        showError("");
      });

      // Form Submission
      document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        showError("");

        const email = e.target.querySelector('input[type="email"]').value.trim();
        const password = document.getElementById('inputPassword').value;

        if (isLoginMode) {
          // Log In
          submitBtn.disabled = true;
          submitBtn.textContent = "登入中...";
          authReady.then(() => auth.signInWithEmailAndPassword(email, password))
            .then((result) => {
              syncUserProfile(result.user);
            })
            .catch((err) => {
              submitBtn.disabled = false;
              submitBtn.textContent = "登入";
              showError("登入失敗：" + err.message);
            });
        } else {
          // Register — nickname defaults to "自律使用者" and can be changed in profile settings
          const nickname = "自律使用者";
          const confirmPassword = confirmInput.value;

          if (password !== confirmPassword) {
            showError("兩次輸入的密碼不一致！");
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = "建立帳號中...";
          authReady.then(() => auth.createUserWithEmailAndPassword(email, password))
            .then((result) => {
              // Send verification email in background
              result.user.sendEmailVerification().then(() => {
                console.log("Verification email sent.");
              }).catch((e) => {
                console.warn("Could not send email verification:", e);
              });
              
              return syncUserProfile(result.user, nickname).then(() => {
                alert("已成功註冊！我們已發送一封電子郵件驗證信至 " + email + "，請至您的信箱查看。（您現在仍可直接開始體驗功能）");
              });
            })
            .catch((err) => {
              submitBtn.disabled = false;
              submitBtn.textContent = "建立帳號並登入";
              showError("註冊失敗：" + err.message);
            });
        }
      });

      // Apple Sign-In (Demo Alert — requires paid Apple Developer account)
      function showAppleAlert() {
        showError('Apple 登入需要配備 Apple 付費開發者帳號（年費 $99 美元）並在 Firebase 控制台填入 Team ID、Service ID 與 .p8 私鑰後才可使用。請改用 Google 或 Email 登入。');
      }
      document.getElementById('btnApple').addEventListener('click', (e) => {
        e.preventDefault();
        showError('');
        showAppleAlert();
      });

      // Google Sign-In (Real Integration)
      document.getElementById('btnGoogle').addEventListener('click', (e) => {
        e.preventDefault();
        showError('');
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider)
          .then((result) => { syncUserProfile(result.user); })
          .catch((err) => { showError('Google 登入失敗：' + err.message); });
      });

      // Facebook Sign-In (Real Integration)
      document.getElementById('btnFacebook').addEventListener('click', (e) => {
        e.preventDefault();
        showError('');
        const provider = new firebase.auth.FacebookAuthProvider();
        auth.signInWithPopup(provider)
          .then((result) => { syncUserProfile(result.user); })
          .catch((err) => { showError('Facebook 登入失敗：' + err.message); });
      });

    </script>
  </body>
</html>
