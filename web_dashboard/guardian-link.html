<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nudge 親屬帳號連結</title>
    <link rel="stylesheet" href="assets/styles.css?v=17" />
    <link rel="stylesheet" href="assets/social_scene.css?v=1" />
  </head>
  <body data-page="guardian" data-social-facility="family">
    <a class="scene-skip-link" href="#sceneMain">跳至內容</a>
    <header class="scene-topbar">
      <a data-town-return href="town.html">← 回小鎮</a>
      <span class="scene-place" data-scene-place>家庭庭院</span>
    </header>
    <nav class="scene-nav" data-scene-nav></nav>
    <main class="main scene-main" id="sceneMain" tabindex="-1">
        <header class="hero scene-hero">
          <div>
            <span class="eyebrow">Account Binding</span>
            <h1>連結親屬帳號，開啟陪伴之旅。</h1>
            <p>與家人的自律帳號進行雙向連結，安全、隱私地同步專注、睡眠與健康指標。</p>
          </div>
          <div class="hero-card">
            <span>帳號綁定狀態</span>
            <strong id="guardianBindStatusText">未連結</strong>
            <p>安全同意機制已啟用。</p>
          </div>
        </header>

        <section class="" style="max-width: 600px; margin: 34px auto 0;">
          <div id="webBindingGatedCard" class="scene-panel" style="padding: 30px;">
            <span class="eyebrow">Relative Binding</span>
            <h2>🛡️ 親屬帳號連結</h2>
            <p id="webBindingDesc" style="margin-bottom: 24px;">您還未與家人進行親屬綁定。請在下方輸入對方的 Nudge ID 發送申請，或在列表處理待同意的申請。連結後即可查看對方專注、睡眠與健康數據。</p>
            
            <div id="webRequestsContainer" style="margin-bottom: 24px;"></div>

            <div id="webBindingForm" class="web-binding-form" style="display: flex; flex-direction: column; gap: 14px;">
              <input type="text" id="webRelativeIdInput" class="module-select" style="background: rgba(255,255,255,0.05); color: #fff; text-align: left; font-family: inherit;" placeholder="輸入對方的 Nudge ID (例如: NDG_XXXXXX)">
              <button id="webRelativeBindBtn" class="button primary" style="width: 100%; border-radius: 12px; font-weight: 700;">發送綁定申請</button>
            </div>
          </div>
        </section>
      </main>
    <script src="assets/town_routes.js?v=3"></script>
    <script src="assets/town_return.js?v=2"></script>
    <script src="assets/social_scene.js?v=1"></script>
    <script src="assets/app.js?v=28"></script>
  </body>
</html>
