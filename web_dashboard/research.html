      <main class="main">

            <article class="panel">

        <!-- Removed the center-hub section containing links to demo scenario, anonymized data, and score demo -->

    <script src="assets/app.js?v=19"></script>
    <script>
      function drawBarChart(canvas, values, labels, color) {
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const ratio = window.devicePixelRatio || 1;
        const w = canvas.offsetWidth;
        const h = canvas.offsetHeight;
        canvas.width = w * ratio;
        canvas.height = h * ratio;
        ctx.scale(ratio, ratio);
        ctx.clearRect(0, 0, w, h);

        const pad = { top: 28, bottom: 34, left: 10, right: 10 };
        const maxVal = Math.max(...values, 1);
        const chartH = h - pad.top - pad.bottom;
        const chartW = w - pad.left - pad.right;
        const step = chartW / values.length;
        const barW = step * 0.55;

        values.forEach((value, i) => {
          const x = pad.left + i * step + (step - barW) / 2;
          const barH = value > 0 ? (value / (maxVal * 1.25)) * chartH : 0;
          const y = pad.top + chartH - barH;

          // Glow bar
          ctx.fillStyle = color;
          ctx.shadowColor = color;
          ctx.shadowBlur = 14;
          ctx.beginPath();
          if (barH > 0) {
            ctx.roundRect(x, y, barW, barH, [5, 5, 0, 0]);
            ctx.fill();
          }
          ctx.shadowBlur = 0;

          // Value on top
          ctx.fillStyle = value > 0 ? "#fff" : "#555";
          ctx.font = "bold 11px system-ui";
          ctx.textAlign = "center";
          ctx.fillText(value, x + barW / 2, value > 0 ? y - 6 : pad.top + chartH - 6);

          // X-axis label
          ctx.fillStyle = "#9ca3af";
          ctx.font = "11px system-ui";
          ctx.fillText(labels[i], x + barW / 2, h - 12);
        });
      }

      function drawCustomDonut(canvas, data, colors) {
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const ratio = window.devicePixelRatio || 1;
        const w = canvas.offsetWidth;
        const h = canvas.offsetHeight;
        canvas.width = w * ratio;
        canvas.height = h * ratio;
        ctx.scale(ratio, ratio);

        const cx = w / 2;
        const cy = h / 2;
        const r = Math.min(cx, cy) - 38;
        const total = data.reduce((a, b) => a + b, 0);
        const percentages = ["20%", "55%", "25%"];

        let startAngle = -Math.PI / 2;
        data.forEach((val, i) => {
          const slice = (val / total) * 2 * Math.PI;
          ctx.beginPath();
          ctx.arc(cx, cy, r, startAngle, startAngle + slice);
          ctx.lineWidth = 22;
          ctx.strokeStyle = colors[i];
          ctx.shadowColor = colors[i];
          ctx.shadowBlur = 18;
          ctx.stroke();
          ctx.shadowBlur = 0;

          // Percentage label outside the ring
          const mid = startAngle + slice / 2;
          const labelR = r + 24;
          const tx = cx + labelR * Math.cos(mid);
          const ty = cy + labelR * Math.sin(mid);
          ctx.fillStyle = "#ddd";
          ctx.font = "bold 11px system-ui";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(percentages[i], tx, ty);

          startAngle += slice;
        });

        // Center text
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 26px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("6.8h", cx, cy - 8);
        ctx.fillStyle = "#9ca3af";
        ctx.font = "13px system-ui";
        ctx.fillText("平均睡眠", cx, cy + 14);
      }

      function drawValueLineChart(canvas, values, labels, color) {
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const ratio = window.devicePixelRatio || 1;
        const w = canvas.offsetWidth;
        const h = canvas.offsetHeight;
        canvas.width = w * ratio;
        canvas.height = h * ratio;
        ctx.scale(ratio, ratio);
        ctx.clearRect(0, 0, w, h);

        const pad = { top: 28, bottom: 34, left: 16, right: 16 };
        const maxVal = Math.max(...values, 1);
        const minVal = Math.min(...values);
        const range = maxVal - minVal || 1;
        const chartH = h - pad.top - pad.bottom;
        const chartW = w - pad.left - pad.right;
        const stepX = chartW / (values.length - 1);

        // Area fill under line
        ctx.beginPath();
        values.forEach((v, i) => {
          const x = pad.left + i * stepX;
          const y = pad.top + chartH - ((v - minVal) / range) * chartH;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        const lastX = pad.left + (values.length - 1) * stepX;
        ctx.lineTo(lastX, pad.top + chartH);
        ctx.lineTo(pad.left, pad.top + chartH);
        ctx.closePath();
        const grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + chartH);
        grad.addColorStop(0, color + "44");
        grad.addColorStop(1, color + "00");
        ctx.fillStyle = grad;
        ctx.fill();

        // Line
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.5;
        ctx.shadowColor = color;
        ctx.shadowBlur = 14;
        ctx.lineJoin = "round";
        values.forEach((v, i) => {
          const x = pad.left + i * stepX;
          const y = pad.top + chartH - ((v - minVal) / range) * chartH;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Points + labels
        values.forEach((v, i) => {
          const x = pad.left + i * stepX;
          const y = pad.top + chartH - ((v - minVal) / range) * chartH;

          ctx.beginPath();
          ctx.arc(x, y, 4, 0, Math.PI * 2);
          ctx.fillStyle = "#fff";
          ctx.fill();
          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.fillStyle = "#fff";
          ctx.font = "bold 10px system-ui";
          ctx.textAlign = "center";
          ctx.fillText(v.toLocaleString(), x, y - 10);

          ctx.fillStyle = "#9ca3af";
          ctx.font = "11px system-ui";
          ctx.fillText(labels[i], x, h - 12);
        });
      }

      function renderAllCharts() {
        drawCustomDonut(
          document.getElementById("researchSleepChart"),
          [20, 55, 25],
          ["#f472b6", "#a78bfa", "#60a5fa"]
        );
        drawBarChart(
          document.getElementById("researchFocusChart"),
          [30, 45, 20, 60, 50, 80, 45],
          ["一", "二", "三", "四", "五", "六", "日"],
          "#60a5fa"
        );
        drawValueLineChart(
          document.getElementById("researchStepsChart"),
          [4000, 5200, 4800, 6000, 7500, 5500, 6250],
          ["一", "二", "三", "四", "五", "六", "日"],
          "#34d399"
        );
        drawBarChart(
          document.getElementById("researchExerciseChart"),
          [10, 15, 0, 30, 45, 20, 25],
          ["一", "二", "三", "四", "五", "六", "日"],
          "#f472b6"
        );
      }

      window.addEventListener("DOMContentLoaded", () => {
        // Use ResizeObserver to render once the canvas containers have real dimensions
        const firstCanvas = document.getElementById("researchSleepChart");
        if (!firstCanvas) return;

        const ro = new ResizeObserver((entries) => {
          if (entries[0].contentRect.width > 0) {
            ro.disconnect();
            renderAllCharts();
          }
        });
        ro.observe(firstCanvas.parentElement);

        // Fallback in case ResizeObserver fires too early
        setTimeout(renderAllCharts, 300);
      });
    </script>
  </body>
</html>
