    <section class="story-hero planner-hero"><div class="story-guide"><img src="assets/town/guide.png" alt="" width="112" height="112" /><p>歐莉說：把這週想做的小事排進日曆，就有了出發的路線。</p></div><div><span class="story-eyebrow">Your quest board</span><h1>這週，想把星光放在哪天？</h1><p>安排任務不會自動完成任務，也不會發放 XP 或自律幣。新增的是每日固定任務，會同步到 App 並每天重設；本週日期安排目前只在 Web 顯示。</p><div class="story-status" id="plannerStatus" role="status" aria-live="polite">正在確認登入狀態…</div></div></section>
    <section class="story-panel" aria-labelledby="plannerTitle"><div class="story-section-heading"><div><span class="story-eyebrow" id="plannerWeek"></span><h2 id="plannerTitle">七日任務地圖</h2></div><button class="story-button" id="plannerSave" type="button" disabled>儲存本週計畫</button></div><p class="story-note">點任務卡的「安排日期」可用鍵盤或手機操作；桌機也能把卡片拖到日期。週一 05:00（台北時間）切換新週；每天安排五件以上時會提醒你留點空間。</p><div class="planner-layout"><aside class="planner-tray" aria-labelledby="trayTitle"><h3 id="trayTitle">待安排任務</h3><form id="plannerNewTask"><label for="plannerTaskTitle">新增每日固定任務</label><div class="planner-add"><input id="plannerTaskTitle" name="title" maxlength="80" autocomplete="off" placeholder="例如：每天讀書 25 分鐘" required /><button id="plannerAddTask" class="story-button story-button-secondary" type="submit">加入草稿</button></div></form><div id="plannerTasks" class="planner-task-list"></div></aside><div id="plannerDays" class="planner-days" aria-label="本週七天"></div></div></section>
