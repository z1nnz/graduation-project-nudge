<!doctype html>
<html lang="zh-Hant">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Nudge 共同目標</title><link rel="stylesheet" href="assets/styles.css?v=13" /></head>
  <body data-page="guardian">
    <div class="shell"><aside class="sidebar"><a class="brand" href="dashboard.html"><span class="brand-mark">N</span><span><strong>Nudge</strong><small>共同目標</small></span></a><nav class="nav"><a href="dashboard.html">總覽入口</a><a class="active" href="guardian.html">家長陪伴中心</a></nav></aside>
      <main class="main">
        <header class="hero split"><div><span class="eyebrow">Shared Goals</span><h1>共同目標必須孩子同意後才啟用。</h1><p>家長只提出目標，孩子可以接受或婉拒；接受後才會同步到 App 任務。</p><div class="subnav"><a href="guardian.html">中心總覽</a><a href="guardian-report.html">孩子週報</a><a href="guardian-encouragement.html">鼓勵卡</a><a class="active" href="guardian-goals.html">共同目標</a><a href="guardian-permissions.html">資料同意</a></div></div><div class="hero-card"><span>待孩子決定</span><strong data-family-goal-count>0</strong><p data-family-latest-goal>目前沒有共同目標。</p></div></header>
        <section class="tool-panel page-section" data-tool="guardian-invite">
          <div class="tool-copy"><span class="eyebrow">Companion Tool</span><h2>共同目標提議器</h2><p>設定目標與陪伴語氣。資料分享不是目標的附帶條件，仍由孩子單獨控制。</p></div>
          <div class="tool-grid">
            <label class="field"><span>共同目標</span><select data-guardian-goal><option value="一週睡滿 49 小時">一週睡滿 49 小時</option><option value="每天專注 30 分鐘">每天專注 30 分鐘</option><option value="每週運動 3 次">每週運動 3 次</option></select></label>
            <label class="field wide"><span>鼓勵訊息</span><textarea data-guardian-message rows="3">這週我們一起把睡眠穩住，不用一次做到完美。</textarea></label>
          </div>
          <div class="generated-card warm" data-output="guardian-preview"><strong>目標預覽</strong><p>目標：一週睡滿 49 小時。孩子可同意或婉拒，接受後才會匯入任務。</p></div>
          <div class="button-row"><button class="button primary" data-action="preview-guardian" type="button">更新預覽</button><button class="button ghost" data-action="send-guardian" type="button">送出目標提議</button></div>
        </section>
      </main>
    </div><script src="assets/app.js?v=18"></script>
  </body>
</html>
