<!doctype html>
<html lang="zh-Hant">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Nudge 共同目標</title><link rel="stylesheet" href="assets/styles.css?v=17" />
    <link rel="stylesheet" href="assets/social_scene.css?v=1" /></head>
  <body data-page="guardian" data-social-facility="family">
    <a class="scene-skip-link" href="#sceneMain">跳至內容</a>
    <header class="scene-topbar">
      <a data-town-return href="town.html">← 回小鎮</a>
      <span class="scene-place" data-scene-place>家庭庭院</span>
    </header>
    <nav class="scene-nav" data-scene-nav></nav>
    <main class="main scene-main" id="sceneMain" tabindex="-1">
        <header class="hero scene-hero"><div><span class="eyebrow">Shared Goals</span><h1>共同目標必須孩子同意後才啟用。</h1><p>家長只提出目標，孩子可以接受或婉拒；接受後才會同步到 App 任務。</p></div><div class="hero-card"><span>待孩子決定</span><strong data-family-goal-count>0</strong><p data-family-latest-goal>目前沒有共同目標。</p></div></header>
        <section class="tool-panel" data-tool="guardian-invite">
          <div class="tool-copy"><span class="eyebrow">Companion Tool</span><h2>共同目標提議器</h2><p>設定目標與陪伴語氣。資料分享不是目標的附帶條件，仍由孩子單獨控制。</p></div>
          <div class="tool-grid">
            <label class="field"><span>共同目標</span><select data-guardian-goal><option value="一週睡滿 49 小時">一週睡滿 49 小時</option><option value="每天專注 30 分鐘">每天專注 30 分鐘</option><option value="每週運動 3 次">每週運動 3 次</option></select></label>
            <label class="field wide"><span>鼓勵訊息</span><textarea data-guardian-message rows="3">這週我們一起把睡眠穩住，不用一次做到完美。</textarea></label>
          </div>
          <div class="generated-card warm" data-output="guardian-preview"><strong>目標預覽</strong><p>目標：一週睡滿 49 小時。孩子可同意或婉拒，接受後才會匯入任務。</p></div>
          <div class="button-row"><button class="button primary" data-action="preview-guardian" type="button">更新預覽</button><button class="button ghost" data-action="send-guardian" type="button">送出目標提議</button></div>
        </section>
      </main>    <script src="assets/town_routes.js?v=7"></script>
    <script src="assets/town_return.js?v=2"></script>

<script src="assets/app.js?v=30"></script>

</html>
