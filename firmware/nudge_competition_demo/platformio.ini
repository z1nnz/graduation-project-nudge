[platformio]
default_envs = orbit_p0a

[env]
platform = espressif32@6.12.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DNUDGE_DEMO=1
extra_scripts = pre:scripts/build_stamp.py

[orbit]
lib_deps = https://github.com/Seeed-Studio/Seeed_GFX.git#0b13b21f284c9bce3351b394bbd871b688d6aec7
build_flags =
  ${env.build_flags}
  -DNUDGE_DEVICE_ORBIT=1
  -DBOARD_SCREEN_COMBO=501

[env:orbit_demo]
lib_deps = ${orbit.lib_deps}
build_flags = ${orbit.build_flags}

[env:orbit_p0a]
lib_deps = ${orbit.lib_deps}
build_flags = ${orbit.build_flags} -DNUDGE_P0A=1

[env:orbit_static]
lib_deps = ${orbit.lib_deps}
build_flags = ${orbit.build_flags} -DNUDGE_ANIMATION=0

[env:orbit_colors]
lib_deps = ${orbit.lib_deps}
build_flags = ${orbit.build_flags} -DNUDGE_DISPLAY_TEST=1

[env:orbit_calibration]
lib_deps = ${orbit.lib_deps}
build_flags = ${orbit.build_flags} -DNUDGE_DISPLAY_TEST=2

[station]
lib_deps =
  https://github.com/adafruit/Adafruit-ST7735-Library.git#d568339f957380ceb05dda57f6712c2704a6394f
  https://github.com/adafruit/Adafruit-GFX-Library.git#f256ef6b0f248711a0cd354be0da5ccd224808c3
  https://github.com/adafruit/Adafruit_BusIO.git#3b8364267c3ee6e16bad91bc2101aefbd5b5915f
build_flags = ${env.build_flags} -DNUDGE_DEVICE_STATION=1

[optional]
lib_deps =
  https://github.com/adafruit/Adafruit_Seesaw.git#829c4ecc056b130d73394d88fa4bf7de2ccbed5d
  https://github.com/adafruit/Adafruit_NeoPixel.git#56b9d7e435926eee5eef5e89ad30ea9b3eb7768b
  https://github.com/adafruit/Adafruit_BusIO.git#3b8364267c3ee6e16bad91bc2101aefbd5b5915f
  https://github.com/sparkfun/SparkFun_VEML7700_Arduino_Library.git#16936136f72ba14dc72dad936cc50d384dfc28db
  https://github.com/sparkfun/SparkFun_Qwiic_Buzzer_Arduino_Library.git#b7173282af4f18bf3c052f5f619cd80953d913fe

; The ST7789 adapter is compiled, but the distributed default profile has NO
; confirmed pin map. It refuses all LCD GPIO/SPI operations until configured.
[env:station_demo]
lib_deps = ${station.lib_deps}
build_flags = ${station.build_flags}

[env:station_p0a]
lib_deps = ${station.lib_deps}
build_flags = ${station.build_flags} -DNUDGE_P0A=1

[env:station_colors]
lib_deps = ${station.lib_deps}
build_flags = ${station.build_flags} -DNUDGE_DISPLAY_TEST=1

[env:station_calibration]
lib_deps = ${station.lib_deps}
build_flags = ${station.build_flags} -DNUDGE_DISPLAY_TEST=2

; Compile all optional drivers, still gated OFF by the default hardware profile.
[env:station_p1_check]
lib_deps =
  ${station.lib_deps}
  ${optional.lib_deps}
build_flags = ${station.build_flags} -DNUDGE_BUILD_OPTIONALS=1

[env:orbit_p1_check]
lib_deps =
  ${orbit.lib_deps}
  ${optional.lib_deps}
build_flags = ${orbit.build_flags} -DNUDGE_BUILD_OPTIONALS=1
